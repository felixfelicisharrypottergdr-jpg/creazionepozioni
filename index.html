/* ==========================================================
   CREAZIONE DI UNA POZIONE — Extra+ integrate
   Peltro + verde acido + viola scuro

   ========================================================== */

#creazione-pozione{
  --bg:#171a1b;
  --bg2:#101213;
  --panel:#252a2b;
  --panel-hi:#2d3334;
  --panel2:#1e2223;
  --line:#505957;

  --acid:#9fbe28;
  --acid-soft:#d4e77d;
  --acid-dim:#7f9920;

  --purple:#35163f;
  --purple2:#482252;
  --purple-soft:#b89cc1;

  --text:#eeeae2;
  --text-dim:#bdbbb2;
  --text-soft:#d7d3c9;

  --danger:#c9687c;
  --danger-bg:#3a2027;

  --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --mono:'Consolas','Courier New',monospace;

  /* alias usati dal JS/CSS preesistente */
  --parch:var(--text);
  --parch-dark:var(--text-dim);
  --ink:var(--text);
  --green:var(--purple);
  --green-dark:var(--acid);
  --gold:var(--acid);

  width:100% !important;
  max-width:none !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 0 72px 0 !important;
  box-sizing:border-box !important;

  background:
    radial-gradient(circle at 12% 0%, rgba(159,190,40,.09), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(72,34,82,.32), transparent 36%),
    linear-gradient(180deg,#202425 0%,#171a1b 68%,#121415 100%) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.55 !important;
}

#creazione-pozione,
#creazione-pozione *{
  box-sizing:border-box !important;
}

/* ---------- contenitore ---------- */

#creazione-pozione .wrap{
  width:96% !important;
  max-width:1180px !important;
  margin:0 auto !important;
  padding:42px 26px 72px !important;
}

/* ---------- sigillo ---------- */

#creazione-pozione .seal{
  width:64px !important;
  height:64px !important;
  margin:0 auto 15px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  border:1px solid var(--acid) !important;
  border-radius:50% !important;
  background:radial-gradient(circle,rgba(159,190,40,.13),rgba(53,22,63,.20) 68%,rgba(16,18,19,.78)) !important;
  color:var(--acid) !important;
  font-size:30px !important;
  line-height:1 !important;
  box-shadow:0 0 0 4px rgba(159,190,40,.035),0 8px 24px rgba(0,0,0,.26),inset 0 0 18px rgba(159,190,40,.08) !important;
}
#creazione-pozione .seal i{color:var(--acid) !important;}

/* ---------- testata ---------- */

#creazione-pozione .main-title{
  position:relative !important;
  margin:0 auto 8px !important;
  padding:0 20px !important;
  text-align:center !important;
  color:var(--text) !important;
  font-family:'magic',var(--serif) !important;
  font-size:42px !important;
  line-height:1.15 !important;
  font-weight:400 !important;
  letter-spacing:.015em !important;
  text-shadow:0 2px 8px rgba(0,0,0,.45) !important;
}

#creazione-pozione .main-title:after{
  content:"" !important;
  display:block !important;
  width:110px !important;
  height:1px !important;

}

#creazione-pozione .title-flask{
  display:inline-block !important;
  margin:0 10px !important;
  color:var(--acid-soft) !important;
  font-size:.62em !important;

/* NON ridefiniamo :before di Font Awesome:
   il forum può già caricare correttamente l'icona fa-flask. */

#creazione-pozione .subtitle{

  margin:0 auto 34px !important;

  color:var(--text-dim) !important;

  font-size:16px !important;

}

#creazione-pozione button.step-btn{
  flex:1 1 135px !important;
  min-width:120px !important;
  min-height:51px !important;
  margin:0 !important;

  appearance:none !important;
  background:transparent !important;
  border:0 !important;
  border-bottom:3px solid transparent !important;
  border-radius:0 !important;
  box-shadow:none !important;

}

#creazione-pozione button.step-btn.active{

}

/* ---------- pannello di ogni fase ---------- */

#creazione-pozione .panel{
  position:relative !important;
  width:100% !important;
  margin:0 0 24px !important;
  padding:30px 32px 32px !important;

  position:absolute !important;

  height:2px !important;

  opacity:.75 !important;
}

  font-family:'magic',var(--serif) !important;
  font-size:26px !important;
  line-height:1.25 !important;
  font-weight:400 !important;
  letter-spacing:.01em !important;

#creazione-pozione .panel h3{

}

/* ---------- testo introduttivo / note ---------- */

#creazione-pozione .guide-text{
  margin:16px 0 28px !important;
  padding:15px 18px !important;

    linear-gradient(90deg,rgba(53,22,63,.62),rgba(53,22,63,.25)) !important;
  border:0 !important;
  border-left:3px solid var(--acid) !important;
  border-radius:0 8px 8px 0 !important;

  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;

}

}

#creazione-pozione button.copy-btn{
  flex:0 0 auto !important;

#creazione-pozione .out-tag{
  display:inline-block !important;

  border-radius:18px !important;

  margin:18px 0 4px !important;
  padding:15px 17px !important;
  background:rgba(16,18,19,.55) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:7px !important;
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  line-height:1.55 !important;
}
#creazione-pozione .prep-summary-box.success{ background:rgba(159,190,40,.09) !important; border-left-color:var(--acid) !important; }

 function migrateLegacySave(saved,pg){
  if(!saved||!pg||!pg.data){return false;}
  var fromVersion=Number(saved.stateVersion||0);
  if(fromVersion>=SAVE_SCHEMA_VERSION){return false;}
  var changed=false;

  if(fromVersion<41){
  /* v41 / bug ereditato dalla v39: non possiamo sapere se un 1d2 Dosi già salvato
     fosse stato tirato prima o dopo l'ultimo d15 di Bacchetta. Per sicurezza lo
     invalidiamo una sola volta. I dati successivi vengono trattati come farebbe
     una normale modifica del 1d2, mentre le dosi extra da Oggetti sono preservate. */
  if(Object.prototype.hasOwnProperty.call(pg.data,"dosi_dice")){
   var oldDosi=pg.data["dosi_dice"];
   if(oldDosi!==""){
    delete pg.data["dosi_dice"];
    var fixedDosi={"0":2,"II":3,"IV":4};
    if(Object.prototype.hasOwnProperty.call(fixedDosi,pg.toccoMagico)){
     pg.data["dosi_base_total"]=fixedDosi[pg.toccoMagico];
    }else{
     delete pg.data["dosi_base_total"];
    }
    clearAfterBac(pg);
    changed=true;
   }
  }

  /* v41 / bug ereditato dalla v40 precedente alla migrazione: il percorso di
     ritentativo poteva sopravvivere alla modifica del dado del 1° tentativo al 66%.
     Se la Distillazione non è già stata invalidata dal blocco Dosi sopra, conserviamo
     il 1° tentativo e cancelliamo soltanto controllo di rischio e 2° tentativo. */
  var firstEff=pgDataGet(pg,"distill_eff","skip");
  var firstRoll=pgDataGet(pg,"distill_roll","");
  var retryRisk=pgDataGet(pg,"distill_retry_risk","");
  var retryEff=pgDataGet(pg,"distill_retry_eff","none");
  var retryRoll=pgDataGet(pg,"distill_retry_roll","");
  var hadRetryState=(retryRisk!=="" || (retryEff!=="" && retryEff!=="none") || retryRoll!=="" || !!pgDataGet(pg,"distill_destroyed",false) || Number(pgDataGet(pg,"distill_attempts",0))>1);
  if(firstEff==="66" && hadRetryState){
   pg.data["distill_retry_risk"]="";
   pg.data["distill_retry_eff"]="none";
   pg.data["distill_retry_roll"]="";
   pg.data["distill_destroyed"]=false;
   pg.data["distill_invalid"]=false;
   pg.data["distill_attempts"]=1;
   pg.data["distill_space"]=intInRange(firstRoll,1,2)?distillSpaceFrom(pg,"66",Number(firstRoll)):null;
   changed=true;
  }
  }

  /* v42: il vecchio totale manuale degli “Oggetti di Pulizia” non identifica quale Calderone
     accelerante fosse stato usato. Non inventiamo la corrispondenza: migriamo a “Nessuno”,
     rimuoviamo l'override e invalidiamo soltanto la Distillazione, che avveniva dopo quella fase. */
  if(fromVersion<42){
   var hadLegacyImbOverride=Object.prototype.hasOwnProperty.call(pg.data,"imb_object_posts_final");
   if(hadLegacyImbOverride){
    delete pg.data["imb_object_posts_final"];
    clearAfterImb(pg);
    changed=true;
   }
   if(!Object.prototype.hasOwnProperty.call(pg.data,"imb_accel_calderone")){
    pg.data["imb_accel_calderone"]="none";
   }
   if(hadLegacyImbOverride){
    var migImbEsito=pgDataGet(pg,"imb_esito","");
    var migImbStatus=pgDataGet(pg,"imb_status","pending");
    if(migImbStatus==="done" && migImbEsito!=="" && migImbEsito!=="0%"){
     var migBase=imbottPostFinali(pg,migImbEsito);
     var migSint=applySintesiToPosts(pg,migBase);
     pg.data["imb_posts_base"]=migBase;
     pg.data["imb_posts"]=migSint.ready?migSint.exact:null;
     if(!migSint.ready){ pg.data["imb_status"]="pending"; }
    }
   }
  }
  /* v43: la v42 salvava soltanto un Calderone accelerante nella fase finale. Le chiavi
     Peltro/Ottone/Rame coincidono con le nuove chiavi globali, quindi possiamo conservarle
     senza inventare alcuna conversione. Gli altri Calderoni non erano identificabili e restano "none". */
  if(fromVersion<43){
   if(!Object.prototype.hasOwnProperty.call(pg.data,"calderone_usato")){
    var oldAccel=String(pgDataGet(pg,"imb_accel_calderone","none")||"none");
    var migrabili={none:1,peltro:1,peltro_elfi:1,ottone:1,ottone_elfi:1,rame:1,rame_elfi:1};
    pg.data["calderone_usato"]=Object.prototype.hasOwnProperty.call(migrabili,oldAccel)?oldAccel:"none";
    changed=true;
   }
   if(Object.prototype.hasOwnProperty.call(pg.data,"imb_accel_calderone")){
    delete pg.data["imb_accel_calderone"];
    changed=true;
   }
  }
  /* v44: la v43 permetteva di proseguire anche senza risolvere il rischio del pieghevole
     degli Elfi, o dopo un 1 che ne determina lo scoppio. Non possiamo ricostruire quando
     siano stati eseguiti i tiri successivi: conserviamo l'eventuale 1d2 ma invalidiamo
     una sola volta le fasi della creazione. */
  if(fromVersion<44 && String(pgDataGet(pg,"calderone_usato","none")||"none")==="pieghevole_elfi"){
   clearAfterFoldingRiskChange(pg);
   changed=true;
  }
  /* v48: nelle v43-v47 Piombo/Carapaci arrotondavano per difetto il totale residuo.
     Il Prezzario usa invece “N% di post per difetto”: per coerenza con gli altri bonus
     percentuali “in più per difetto”, si arrotonda la quantità da sottrarre. Conserviamo
     il d10 di Imbottigliamento e l'eventuale controllo di consapevolezza, ricalcoliamo
     soltanto i post e invalidiamo la Distillazione successiva. */
  if(fromVersion<48){
   var floorKey=String(pgDataGet(pg,"calderone_usato","none")||"none");
   var floorAffected=(floorKey==="piombo_illegale" || floorKey==="carapace_schiopodo" || floorKey==="carapace_fiammagranchio");
   if(floorAffected){
    var floorStatus=pgDataGet(pg,"imb_status","pending");
    var floorEsito=pgDataGet(pg,"imb_esito","");
    if(floorStatus==="done" && floorEsito!=="" && floorEsito!=="0%"){
     var floorBase=imbottPostFinali(pg,floorEsito);
     var floorSint=applySintesiToPosts(pg,floorBase);
     var floorCalc=floorSint.ready?applyCalderoneToPosts(pg,floorSint.exact):{ready:false,exact:null};
     pg.data["imb_posts_base"]=floorBase;
     pg.data["imb_posts"]=floorCalc.ready?floorCalc.exact:null;
     if(!floorSint.ready){pg.data["imb_status"]="pending";}
     clearAfterImb(pg);
     changed=true;
    }
   }
  }
  /* v49: la v48 assumeva Sintesi -> Calderone. Con “per difetto” l'ordine può cambiare
     il risultato e il materiale disponibile non stabilisce una precedenza. Nei salvataggi
     interessati non inventiamo la scelta: conserviamo i dadi/esiti di Imbottigliamento,
     rendiamo pendente soltanto il totale dei post e invalidiamo la Distillazione successiva. */
  if(fromVersion<49){
   delete pg.data["imb_stack_order"];
   var stackCaldMig=calderoneInfo(pg);
   var stackStatusMig=pgDataGet(pg,"imb_status","pending");
   var stackEsitoMig=pgDataGet(pg,"imb_esito","");
   if(stackCaldMig.postFloor && stackCaldMig.postPercent>0 && stackStatusMig==="done" && stackEsitoMig!=="" && stackEsitoMig!=="0%"){
    var stackBaseMig=imbottPostFinali(pg,stackEsitoMig);
    var stackSintMig=applySintesiToPosts(pg,stackBaseMig);
    if(stackSintMig.ready && stackSintMig.info && stackSintMig.info.percent>0){
     pg.data["imb_posts_base"]=stackBaseMig;
     pg.data["imb_posts"]=null;
     pg.data["imb_status"]="pending";
     clearAfterImb(pg);
     changed=true;
    }
   }
  }
  return changed;
 }
 function restoreSavedState(){

    pgs=saved.pgs;
    /* Migrazione dai salvataggi delle vecchie versioni che potevano contenere più co-creatori.
       Il regolamento richiede un solo creatore per tutte le fasi: gli altri PG possono intervenire
       soltanto come aiutanti nella Preparazione, tramite il flusso dedicato. */
    if(pgs.length>1){ pgs=[pgs[0]]; }
    if(!pgs[0].data){ pgs[0].data={}; }
    /* v22: la normalizzazione di un vecchio profilo non deve lasciare in vita dadi/esiti
       calcolati con livelli che lo Studente non può più possedere. In caso di correzione
       del creatore o dell'aiutante, conserviamo i dati anagrafici ma azzeriamo i risultati. */
    var gradeModelMigrated = migrateStudentGradeModel(pgs[0]);
    var profileMigrated = normalizePGProfile(pgs[0]);
    var helperMigrated = normalizeSavedPrepHelpers(pgs[0]);
    if(gradeModelMigrated || profileMigrated || helperMigrated){
      /* Correggere un vecchio profilo invalida i risultati, non l'attrezzatura scelta. */
      resetDataPreservingCalderone(pgs[0],true);
      staleResultsResetNotice = true;
    }
    /* v19: corregge anche i vecchi salvataggi creati prima che il controllo di rischio
       della Distillazione bloccasse correttamente il Riepilogo. */
    var oldDistEff = pgDataGet(pgs[0], "distill_eff", "skip");
    var oldRisk = pgDataGet(pgs[0], "distill_retry_risk", "");
    if((oldDistEff === "0" || oldDistEff === "33" || oldDistEff === "66") && oldRisk !== "" && !intInRange(oldRisk,1,2)){
      pgs[0].data["distill_invalid"] = true;
      pgs[0].data["distill_space"] = null;
    }
    if(migrateLegacySave(saved,pgs[0])){ staleResultsResetNotice=true; }
   }
   if(saved&&saved.pgCounter){pgCounter=saved.pgCounter;}
   if(pgs.length===1 && (!pgCounter || pgCounter<Number(pgs[0].id||1))){pgCounter=Number(pgs[0].id||1);}
   if(saved&&saved.currentStep){for(var si=0;si<steps.length;si++){if(steps[si].key===saved.currentStep){currentStep=saved.currentStep;break;}}}
   /* Scrive subito lo schema corrente: la bonifica è una tantum e non si ripete ai caricamenti successivi. */
   if(needsSchemaSave){saveState();}
  }catch(e){}

 var voto_bonus = { T:-3, D:-2, S:-1, A:0, O:1, E:2 };

 var voto_nomi = { T:"Troll", D:"Desolante", S:"Scadente", A:"Accettabile", O:"Oltre Ogni Previsione", E:"Eccezionale" };
 function votoNome(v){ return voto_nomi[v] ? (voto_nomi[v] + " (" + v + ")") : v; }
 function votoValido(v){ return voto_labels.indexOf(v) !== -1; }
 function getMediaPozioniBonus(pg){

 function extraGradeField(field){

 function studentSingleGradeCompatibilityIssue(pg, grade, label){
  if(!pg || pg.tipo !== "studente" || !votoValido(pg.mediaPozioni) || !votoValido(grade)){ return ""; }
  var nome = label || "voto individuale";
  if(pg.mediaPozioni === "T" && grade !== "T"){
   return "Con Media scolastica Troll, tutte le Conoscenze della materia sono ancora a Troll: " + nome + " non può essere " + votoNome(grade) + ".";
  }
  if(pg.mediaPozioni === "D" && grade !== "D"){
   return "Con Media scolastica Desolante, tutte le Conoscenze della materia sono a Desolante: " + nome + " non può essere " + votoNome(grade) + ".";
  }
  if((pg.mediaPozioni === "S" || pg.mediaPozioni === "A" || pg.mediaPozioni === "O" || pg.mediaPozioni === "E") && (grade === "T" || grade === "D")){
   return "Con Media scolastica almeno Scadente, le Conoscenze hanno già superato i miglioramenti globali Troll → Desolante → Scadente: " + nome + " non può essere " + votoNome(grade) + ".";

 function num(v, def){ 
 var n = parseFloat(v); 
 if(isNaN(n)){ return def; } 
 return n; 
 }

 function intInRange(v, min, max){
  if(v === "" || v === null || v === undefined){ return false; }
  var n = Number(v);
  return isFinite(n) && Math.floor(n) === n && n >= min && n <= max;
 }

 function nonNegativeInt(v){
  if(v === "" || v === null || v === undefined){ return false; }
  var n = Number(v);
  return isFinite(n) && Math.floor(n) === n && n >= 0;
 }

 function optionalNonNegativeInt(v){
  if(v === "" || v === null || v === undefined){ return true; }
  return nonNegativeInt(v);
 }

 function safeBonus(v){
  return nonNegativeInt(v) ? Number(v) : 0;
 }

 function bonusInputInfo(v){
  return { valid: nonNegativeInt(v), value: nonNegativeInt(v) ? Number(v) : 0 };
 }


 function manualBonusEntries(pg,key){
  if(!pg.data){ pg.data={}; }
  var arr=pg.data[key+"_entries"];
  if(!Array.isArray(arr)){
   arr=[];
   var legacy=pg.data[key];
   if(nonNegativeInt(legacy) && Number(legacy)>0){ arr.push({value:String(legacy),target:"roll",source:""}); }
  }
  while(arr.length<2){ arr.push({value:"",target:"roll",source:""}); }
  for(var i=0;i<arr.length;i++){
   if(!arr[i]||typeof arr[i]!=="object"){ arr[i]={value:"",target:"roll",source:""}; }
   if(arr[i].value===undefined||arr[i].value===null){arr[i].value="";}
   if(arr[i].target!=="technique"){arr[i].target="roll";}
   if(arr[i].source===undefined||arr[i].source===null){arr[i].source="";}
  }
  pg.data[key+"_entries"]=arr;
  return arr;
 }

 function manualBonusTotals(pg,key,allowTechnique){
  var arr=manualBonusEntries(pg,key);
  var roll=0, technique=0, valid=true;
  for(var i=0;i<arr.length;i++){
   var raw=arr[i].value;
   if(raw===""||raw===null||raw===undefined){continue;}
   if(!nonNegativeInt(raw)){valid=false;continue;}
   var n=Number(raw);
   if(allowTechnique && arr[i].target==="technique"){ technique+=n; }
   else { roll+=n; }
  }
  pg.data[key]=roll; /* compatibilità con le formule/chiavi storiche: qui resta solo il bonus diretto al tiro */
  return {roll:roll,technique:technique,total:roll+technique,valid:valid};
 }

 function trackedEffectEntries(pg){

 function nonNegativeNumber(v){
  if(v===""||v===null||v===undefined){return false;}
  var n=Number(v); return isFinite(n)&&n>=0;

 function trackedEffectInfo(pg){
  var arr=trackedEffectEntries(pg);
  var bonus={prep:0,prod:0,bacchetta:0,imbott:0};
  var fatigue={prep:0,prod:0,bacchetta:0,imbott:0};
  var active=[]; var valid=true;
  for(var i=0;i<arr.length;i++){
   var e=arr[i];
   var hasAny=String(e.source||"").trim()!==""||String(e.detail||"").trim()!==""||String(e.bonus||"")!==""||String(e.fatigue||"")!==""||String(e.usesBefore||"")!==""||String(e.usesSpent||"")!=="";
   if(!hasAny){continue;}
   var entryValid=true;
   if(String(e.source||"").trim()===""){entryValid=false;}
   if(!nonNegativeInt(e.bonus)){entryValid=false;}
   if(e.fatigue!==""&&!nonNegativeNumber(e.fatigue)){entryValid=false;}
   var usageEntered=(e.usesBefore!==""||e.usesSpent!=="");
   if(usageEntered){
    if(!nonNegativeInt(e.usesBefore)||!nonNegativeInt(e.usesSpent)||Number(e.usesSpent)>Number(e.usesBefore)){entryValid=false;}
   }
   if(!entryValid){valid=false;}
   var b=nonNegativeInt(e.bonus)?Number(e.bonus):0;
   var f=e.fatigue!==""&&nonNegativeNumber(e.fatigue)?Number(e.fatigue):0;
   if(entryValid){bonus[e.phase]+=b;fatigue[e.phase]+=f;}
   active.push({entry:e,valid:entryValid,bonus:b,fatigue:f,usageEntered:usageEntered,remaining:usageEntered&&entryValid?Number(e.usesBefore)-Number(e.usesSpent):null});
  }
  return {valid:valid,bonus:bonus,fatigue:fatigue,active:active};
 }

 function setupIssue(){
  var classi = ["X","XX","XXX","XXXX","XXXXX"];
  if(classi.indexOf(POZ.classificazione) === -1){ return "Seleziona la Classificazione della Pozione nello Step 1."; }
  if(!POZ.tierBase && !POZ.tierIV && !POZ.tierV){ return "Seleziona almeno una fascia di Ingredienti nello Step 1."; }
  if(!POZ.conoscenzaPosseduta){ return "Conferma nello Step 1 che il creatore possiede la Conoscenza della Pozione o la possiede tramite il Piano di Studi."; }
  if(!positiveInt(POZ.forzaStandard)){ return "Inserisci la Forza Standard della Pozione nello Step 1 come intero maggiore di 0."; }
  if(!pgs.length){ return "Inserisci il Personaggio nello Step 2."; }

  if(pg.tipo !== "studente" && pg.tipo !== "adulto"){ return "Seleziona se il Personaggio è Studente o Adulto nello Step 2."; }

  var setupCald=calderoneInfo(pg);
  if(setupCald.foldRisk){
   var setupRisk=pgDataGet(pg,"calderone_pieghevole_risk","");
   if(!intInRange(setupRisk,1,2)){ return "Risolvi nello Step 2 il 1d2 del Calderone pieghevole del Mercato degli Elfi: con 1 il calderone scoppia."; }
   if(Number(setupRisk)===1){ return "Il 1d2 del Calderone pieghevole del Mercato degli Elfi ha dato 1: il Prezzario indica che il calderone scoppia. Seleziona un altro Calderone/strumento prima di iniziare o riprendere la creazione."; }
  }
  if(pg.tipo === "studente" && !votoValido(pg.mediaPozioni)){ return "Seleziona la Media scolastica in Pozioni nello Step 2."; }
  if(pg.tipo === "studente" && levelNum(pg.chimico) === 0 && !votoValido(pg.votoPozione)){ return "Seleziona il voto nella Pozione specifica che stai preparando nello Step 2, oppure usa Chimico I se posseduto."; }
  if(pg.tipo === "studente"){
   /* Chimico sostituisce il voto della singola Pozione nella Produzione: se è posseduto,
      un voto specifico assente o incompatibile non deve bloccare un calcolo che non lo usa. */
   if(levelNum(pg.chimico) === 0){
    var votoPozIssue = studentSingleGradeCompatibilityIssue(pg, pg.votoPozione, "il voto della Pozione specifica");
    if(votoPozIssue){ return votoPozIssue; }

   var advFields = ["speziale","chimico","toccoMagico","calderaio","distillatore"];

  }
  if(pg.tipo === "adulto" && !intInRange(pg.sapienzaPozionistica, 0, 25)){ return "Inserisci la Sapienza Pozionistica dell'Adulto come intero da 0 a 25 nello Step 2."; }

 }

 function phaseDependencyIssue(step, pg){
  if(!pg){ return "Inserisci prima il Personaggio."; }
  if(step === "prod"){
    var tiers = getTiersPresentList();
    var prep = computePrepAccumulo(pg, tiers);
    if(!prep.complete){ return "Completa tutti i risultati della Preparazione degli Ingredienti prima di passare alla Produzione."; }
  }
  if(step === "bacchetta"){
    var ps=pgDataGet(pg,"prod_status","pending");
    if(ps==="discarded"){return "La Produzione è stata abbandonata: la Pozione è stata buttata e il processo è concluso.";}
    if(ps!=="success"&&ps!=="fail"){return "Completa la Produzione e scegli come procedere in caso di fallimento prima di usare la Bacchetta.";}
  }
  if(step === "imbott"){
    var bs = pgDataGet(pg, "bac_status", "pending");
    if(bs !== "success" && bs !== "fail"){ return "Completa l'Uso della Bacchetta prima dell'Imbottigliamento e Pulizia del Calderone."; }
    var dosiImb = computeDosiFinali(pg);
    /* Il regolamento contempla esplicitamente anche 0 dosi finali dopo la Bacchetta.
       È un esito risolto, non un valore mancante: non c'è nulla da imbottigliare, ma la
       Pulizia del Calderone va comunque conclusa. */
    if(dosiImb.finale === null || !nonNegativeInt(dosiImb.finale)){ return "Determina anche il numero finale di dosi ottenute nello Step 5 prima di procedere all'Imbottigliamento/Pulizia."; }
  }
  if(step === "distill"){
    var dosiDist = computeDosiFinali(pg);
    if(dosiDist.finale === null || !positiveInt(dosiDist.finale)){ return "Determina prima il numero finale di dosi: la Distillazione si esegue sulle singole dosi di Pozione che vuoi trattare."; }
    var ie = pgDataGet(pg, "imb_esito", "");
    var ist = pgDataGet(pg, "imb_status", "pending");
    if(ist !== "done" || (ie !== "33%" && ie !== "66%" && ie !== "100%")){
      return "La Distillazione è disponibile soltanto dopo una creazione conclusa con Imbottigliamento/Pulizia diverso da 0%.";
    }
  }
  if(step === "riepilogo"){
    var prodR=pgDataGet(pg,"prod_status","pending");
    /* Anche una Pozione persa deve poter arrivare al Riepilogo per scalare gli Ingredienti già consumati. */
    if(prodR==="discarded"){ return ""; }
    var rie = pgDataGet(pg, "imb_esito", "");
    var rist = pgDataGet(pg, "imb_status", "pending");
    if(!!pgDataGet(pg, "distill_destroyed", false)){ return ""; }
    if(rist === "done" && rie === "0%"){ return ""; }
    if(rist !== "done"){ return "Completa l'Imbottigliamento e Pulizia del Calderone prima del Riepilogo Finale."; }
  }
  return "";
 }

  if(!issue){ return false; }
  panel.appendChild(el("div", "guide-text", "<b>Fase precedente non conclusa.</b> " + issue));
  return true;

 function flashCopied(btn, ok){ 
 var old = btn.getAttribute("data-orig") || btn.textContent; 
 btn.setAttribute("data-orig", old); 
 btn.textContent = ok ? "Copiato!" : "Copia manualmente"; 
 setTimeout(function(){ btn.textContent = old; }, 1600); 
 } 
 
 function selectSourceText(src){ 
 try{ 
 var range = document.createRange(); 
 range.selectNodeContents(src); 
 var sel = window.getSelection(); 
 sel.removeAllRanges(); 
 sel.addRange(range); 
 return true; 
 }catch(e){ 
 return false; 
 } 
 } 
 
 function fallbackCopyText(txt){ 
 var ta = document.createElement("textarea"); 
 ta.value = txt; 
 ta.setAttribute("readonly", ""); 
 ta.style.position = "fixed"; 
 ta.style.top = "0"; 
 ta.style.left = "-9999px"; 
 document.body.appendChild(ta); 
 ta.focus(); 
 ta.select(); 
 ta.setSelectionRange(0, txt.length); 
 var ok = false; 
 try{ 
 ok = document.execCommand("copy"); 
 } catch(e){ 
 ok = false; 
 } 
 document.body.removeChild(ta); 
 return ok; 
 } 
 
 function attachCopy(btnId, sourceId){ 
 var btn = document.getElementById(btnId); 
 if(!btn){ return; } 
 btn.addEventListener(EV, function(){ 
 var src = document.getElementById(sourceId); 
 if(!src){ flashCopied(btn, false); return; } 
 var txt = src.textContent; 
 var handledAsync = false; 
 if(navigator.clipboard){ 
 if(navigator.clipboard.writeText){ 
 handledAsync = true; 
 navigator.clipboard.writeText(txt).then(function(){ 
 flashCopied(btn, true); 
 }).catch(function(){ 
 var ok = fallbackCopyText(txt); 
 if(!ok){ selectSourceText(src); } 
 flashCopied(btn, ok); 
 }); 
 } 
 } 
 if(!handledAsync){ 
 var ok2 = fallbackCopyText(txt); 
 if(!ok2){ selectSourceText(src); } 
 flashCopied(btn, ok2); 
 } 
 }); 
 }

function faticaFaseNumero(pg, fase){

function faticaFaseTesto(pg, fase){
 if(fase === "distill"){
   var doseCount = Number(pgDataGet(pg, "distill_dose_count", 0));
   if(!isFinite(doseCount) || doseCount < 0){ doseCount = 0; }
   if(doseCount === 0){ return "0 Fatica — Distillazione non svolta."; }
   if(haSapienzaPozionistica25(pg)){ return "0 Fatica — Sapienza Pozionistica 25."; }
   var att = Number(pgDataGet(pg, "distill_attempts", doseCount));
   if(!isFinite(att) || att < 1){ att = doseCount; }
   return "-" + att + " Fatica per " + doseCount + " " + (doseCount === 1 ? "dose distillata" : "dosi distillate") + " (" + att + " " + (att === 1 ? "tentativo complessivo" : "tentativi complessivi") + ").";
 }
 var base = faticaFaseNumero(pg, fase);
 var extra = faticaExtraFaseNumero(pg, fase);
 var tracked = faticaTracciataFaseNumero(pg, fase);
 var totale = base + extra + tracked;
 var parti = [];
 if(base === 0){ parti.push("fase 0 per Sapienza Pozionistica 25"); }
 else { parti.push("fase -" + fmtFatica(base)); }
 if(extra > 0){
   var nomeExtra = fase === "prep" ? "Manualità Tecnica+" : (fase === "prod" ? "Memoria Tecnica+" : "Sintesi Tecnica+");
   parti.push(nomeExtra + " -" + fmtFatica(extra));
 }
 if(tracked > 0){parti.push("Oggetti/Conoscenze -"+fmtFatica(tracked));}
 return "-" + fmtFatica(totale) + " Fatica totale (" + parti.join("; ") + ").";
 }

 function migrateStudentGradeModel(pg){
  if(!pg){ return false; }
  if(pg.tipo !== "studente"){
   if(pg.mediaPozioni === undefined){ pg.mediaPozioni = ""; }
   if(pg.votoPozione === undefined){ pg.votoPozione = ""; }
   if(pg.votoManualita === undefined){ pg.votoManualita = ""; }
   if(pg.votoMemoria === undefined){ pg.votoMemoria = ""; }
   if(pg.votoSintesi === undefined){ pg.votoSintesi = ""; }
   return false;
  }
  var changed = false;
  if(pg.mediaPozioni === undefined){
   pg.mediaPozioni = (pg.tipo === "studente" && votoValido(pg.voto)) ? pg.voto : "";
   changed = true;
  }
  if(pg.votoPozione === undefined){
   /* Il vecchio campo era genericamente "Voto scolastico in Pozioni" e non consente di
      sapere quale fosse il voto della singola Pozione. Non lo inventiamo: va riconfermato. */
   pg.votoPozione = "";
   changed = true;
  }
  var extraFields = ["votoManualita","votoMemoria","votoSintesi"];
  for(var i=0;i<extraFields.length;i++){
   if(pg[extraFields[i]] === undefined){ pg[extraFields[i]] = ""; changed = true; }
  }

 }

 function normalizePGProfile(pg){
  if(!pg || pg.tipo !== "studente"){ return false; }
  var changed = false;
  var advFields = ["speziale","chimico","toccoMagico","calderaio","distillatore"];
  var anyLevelI = false;
  for(var i=0;i<advFields.length;i++){
   var f = advFields[i];
   if(pg[f] !== "0" && pg[f] !== "I"){ pg[f] = "0"; changed = true; }
   if(pg[f] === "I"){ anyLevelI = true; }
  }
  /* Uno Studente può possedere soltanto Sapienza I: non deve trascinarsi dietro
     un vecchio valore Adulto (es. 25) mentre il campo è nascosto. */
  var normalizedSapienza = anyLevelI ? 1 : null;
  if(pg.sapienzaPozionistica !== normalizedSapienza){ pg.sapienzaPozionistica = normalizedSapienza; changed = true; }
  if(pg.sapienzaAdulto !== false){ pg.sapienzaAdulto = false; changed = true; }
  return changed;
 }

 function normalizeSavedPrepHelpers(pg){
  if(!pg || !pg.data){ return false; }
  var changed = false;
  var tiers = ["base","iv","v"];
  for(var i=0;i<tiers.length;i++){
   var key = tiers[i];
   var tipo = pgDataGet(pg,"prep_help_tipo_"+key,"");
   var spec = pgDataGet(pg,"prep_help_speziale_"+key,"0");
   if(tipo === "studente" && spec !== "0" && spec !== "I"){
    pg.data["prep_help_speziale_"+key] = "0";
    pg.data["prep_help_acc_result_"+key] = "";
    changed = true;
   }
  }
  return changed;
 }

 function prepForzaBonusPercent(pg){
 var map = { I:20, II:25, III:30, IV:35, V:40 };
 if(levelNum(pg.speziale) > 0){ return map[pg.speziale]; }
 if(pg.tipo === "studente"){
  if(pg.mediaPozioni === "O"){ return 5; }
  if(pg.mediaPozioni === "E"){ return 10; }
  return 2;
 }
 return 15;
 } 
 
 function prepMalusPercent(pg){ 
 var base; 
 var tecEff=effectiveTechnique(pg);
 if(tecEff <= 5){ base = 65; } 
 else if(tecEff <= 10){ base = 60; } 
 else if(tecEff <= 15){ base = 55; } 
 else { base = 50; } 
 var reduction = 0; 
 var map = { I:5, II:10, III:15, IV:20, V:25 }; 
 if(pg.speziale !== "0"){ reduction = map[pg.speziale]; } 
 var result = base - reduction; 
 if(result < 0){ result = 0; } 
 return result; 
 } 
 
 function accorgersiPrepSoglia(pg){ 
 // possibilita' su 10 di accorgersi dell'errore in Preparazione 
 var base = 5; 
 var map = { I:1, II:2, III:3, IV:4 }; 
 if(pg.speziale !== "0"){ 
 if(pg.speziale !== "V"){ 
 base = base + map[pg.speziale]; 
 } 
 } 
 if(base > 10){ base = 10; } 
 return base; 
 }

 function computePrepAccumulo(pg, tiersList){ 
 var allSuccess = true; 
 var anyUnremFail = false; 
 var anyIncomplete = false; 
 if(tiersList.length === 0){ allSuccess = false; anyIncomplete = true; } 
 for(var i=0;i<tiersList.length;i++){ 
 var st = pgDataGet(pg, "prep_status_" + tiersList[i], "pending"); 
 if(st === "pending" || st === "invalid"){ anyIncomplete = true; } 
 if(st === "fail_pending"){ anyIncomplete = true; } 
 if(st !== "success"){ allSuccess = false; } 
 if(st === "fail_unremediated"){ anyUnremFail = true; } 
 } 
 var forza = 0; 
 var durata = 0; 
 if(allSuccess){ forza = prepForzaBonusPercent(pg); } 
 if(anyUnremFail){ durata = 0 - prepMalusPercent(pg); } 
 return { forza: forza, durata: durata, complete: !anyIncomplete, allSuccess: allSuccess }; 
 } 
 
 function computeProdAccumulo(pg){ 
 var status = pgDataGet(pg, "prod_status", "pending"); 
 var forza = 0; 
 if(status === "success"){ forza = prodForzaBonusPercent(pg); } 
 if(status === "fail"){ forza = 0 - prodMalusPercent(pg); } 
 return { forza: forza, complete: status === "success" || status === "fail" }; 
 } 
 
 function computeDosiFinali(pg){ 
 var dosiBase = pgDataGet(pg, "dosi_base_total", null); 
 var bacStatus = pgDataGet(pg, "bac_status", "pending"); 
 var doseExtraRaw = pgDataGet(pg, "dosi_extra_oggetti", 0);
 if(!nonNegativeInt(doseExtraRaw)){
   return { finale:null, testo:"correggi le dosi aggiuntive da altri Oggetti: usa un intero da 0 in su" };
 }
 var doseExtraManuale = Number(doseExtraRaw);
 var caldDoseInfo = calderoneInfo(pg);
 var doseExtraCalderone = caldDoseInfo.doseExtra;
 var doseExtra = doseExtraManuale + doseExtraCalderone;
 if(dosiBase === null){ 
 return { finale: null, testo: "da calcolare (tira ancora il dado delle Dosi)" }; 
 } 
 var finale = Number(dosiBase) + doseExtra; 
 var extraParts=[];
 if(doseExtraCalderone>0){extraParts.push(doseExtraCalderone+" da "+caldDoseInfo.label);}
 if(doseExtraManuale>0){extraParts.push(doseExtraManuale+" da altri Oggetti");}
 var extraTxt=extraParts.length?(" + "+extraParts.join(" + ")):"";
 var testo = "" + dosiBase + " (Tocco Magico)" + extraTxt; 
 if(bacStatus === "fail"){ 
 finale = finale - 1; 
 if(finale < 0){ finale = 0; } 
 testo = "" + finale + " (" + dosiBase + " da Tocco Magico" + extraTxt + ", -1 per fallimento dell'Uso della Bacchetta)"; 
 } else if(bacStatus === "success"){ 
 testo = "" + finale + " (" + dosiBase + " da Tocco Magico" + extraTxt + ", nessuna penalità: Uso della Bacchetta riuscito)"; 
 } else if(bacStatus === "invalid"){
 return { finale:null, testo:"correggi prima il risultato impossibile dell'Uso della Bacchetta" };
 } else { 
 return { finale:null, testo:"provvisorio: dipende dall'esito dell'Uso della Bacchetta qui sopra" };
 } 
 return { finale: finale, testo: testo }; 
 }

 function extraBonusStatic(pg, field, efficacia){
 // Manualità/Memoria: ritorna bonus OFFGame dopo la risoluzione dell'Efficacia
 if(!extraIsUsed(pg,field)){ return { fixed:0, diceFaces:0, ready:true }; }
 var eff = normalizeExtraEfficacia(pg,field);
 if(eff === "pending"){ return { fixed:0, diceFaces:0, ready:false }; }
 if(eff === "0"){ return { fixed:0, diceFaces:0, ready:true }; }
 if(pg.tipo === "studente"){
  if(eff === "100"){ return { fixed:2, diceFaces:0, ready:true }; }
  if(eff === "66"){ return { fixed:0, diceFaces:2, ready:true }; }
  if(eff === "33"){ return { fixed:1, diceFaces:0, ready:true }; }
 } else {
  if(haSapienzaPozionistica(pg)){
   if(eff === "100"){ return { fixed:3, diceFaces:0, ready:true }; }
   return { fixed:0, diceFaces:0, ready:false };
  }
  if(eff === "100"){ return { fixed:1, diceFaces:2, ready:true }; }
  if(eff === "66"){ return { fixed:0, diceFaces:3, ready:true }; }
  if(eff === "33"){ return { fixed:0, diceFaces:2, ready:true }; }
 }
 return { fixed:0, diceFaces:0, ready:false };
 }

 function calcPrepTier(pg, tier){
 var prepManual = manualBonusTotals(pg, "prep_extra_" + tier.key, false);
 var tecnicaEffettiva = effectiveTechnique(pg);
 var tecBase = tecnicaBasePrep(tecnicaEffettiva);
 var d6 = pgDataGet(pg, "prep_d6", "");
 var competenzaB = 0;
 var ready = true;
 var waiting = [];

 if(levelNum(pg.speziale) > 0){
   competenzaB = levelNum(pg.speziale);
 } else if(pg.tipo === "studente"){
   competenzaB = getMediaPozioniBonus(pg);
 } else {
   if(intInRange(d6,1,6)){ competenzaB = Number(d6) - 4; }
   else { ready = false; waiting.push("1d6 Adulto senza Speziale"); }
 }

 var classB = tierBonusPrep(tier.key);

 var extraObj = extraBonusStatic(pg, "manualita", pg.manualita);
 var manFixed = extraObj.fixed;

 if(!extraObj.ready){
   manFixed = 0; ready = false; waiting.push("1d10 Efficacia Manualità Tecnica+");
 } else if(extraObj.diceFaces > 0){
   var dv = pgDataGet(pg, "prep_man_dice", "");
   if(intInRange(dv,1,extraObj.diceFaces)){
     manFixed = manFixed + Number(dv);
   } else {
     manFixed = 0; ready = false; waiting.push("dado Manualità Tecnica+");
   }
 }

 var extraManual = prepManual.roll;
 var extraTracked = trackedEffectBonus(pg,"prep");
 if(!prepManual.valid){ ready = false; waiting.push("Altri bonus: inserisci solo numeri interi da 0 in su"); }

 var votoTotale = competenzaB;
 var extraTotale = manFixed + extraManual + extraTracked;
 var total = tecBase + votoTotale + classB + extraTotale;

 if(total > 14){ total = 14; }
 if(total < 0){ total = 0; }

 return {
   tecBase: tecBase,
   tecnicaEffettiva: tecnicaEffettiva,
   votoTotale: votoTotale,
   classB: classB,
   extraTotale: extraTotale,
   total: total,
   ready: ready,
   waiting: waiting
 };
 }

 function refreshPrepAccumulo(pg){ 
 var accBox = document.getElementById("prep-accumulo-" + pg.id); 
 if(!accBox){ return; } 

 var tiersList = getTiersPresentList(); 
 var acc = computePrepAccumulo(pg, tiersList);
 var bonusPerfetto = prepForzaBonusPercent(pg);
 var malusErrore = prepMalusPercent(pg);

 var hasRemediated = false;
 var hasUnremediated = false;
 var hasPending = false;

 for(var i=0;i<tiersList.length;i++){
   var st = pgDataGet(pg, "prep_status_" + tiersList[i], "pending");
   if(st === "fail_remediated"){ hasRemediated = true; }
   if(st === "fail_unremediated"){ hasUnremediated = true; }
   if(st === "pending" || st === "fail_pending"){ hasPending = true; }
 }

 var testo = "";
 var classe = "prep-summary-box";

 if(acc.complete && acc.allSuccess){
   classe += " success";
   testo =
     '<span class="prep-main"><b>Tutte le preparazioni sono riuscite: +' + bonusPerfetto + '% alla Forza della Pozione.</b></span>' +
     'Nessun malus alla Durata.';
 } else if(hasUnremediated){
   classe += " fail";
   testo =
     '<span class="prep-main"><b>Almeno una preparazione è fallita senza essere rimediata: -' + malusErrore + '% alla Durata degli effetti e dei bonus/malus.</b></span>' +
     'Il bonus di +' + bonusPerfetto + '% alla Forza non si applica, perché per ottenerlo devono riuscire tutte le preparazioni.';
 } else if(hasRemediated && !hasPending){
   classe += " warning";
   testo =
     '<span class="prep-main"><b>Una o più preparazioni sono fallite, ma l’errore è stato rimediato.</b></span>' +
     'Nessun malus alla Durata; il bonus di +' + bonusPerfetto + '% alla Forza però non si applica.';
 } else {
   classe += " warning";
   testo =
     '<span class="prep-main"><b>Esito complessivo ancora da determinare.</b></span>' +
     'Se <b>tutte</b> le preparazioni riusciranno: <b>+' + bonusPerfetto + '% Forza</b>. ' +
     'Se almeno una preparazione fallirà e l’errore non verrà rimediato: <b>-' + malusErrore + '% Durata</b>. ' +
     'Se l’errore viene rimediato, non si applica il malus, ma si perde comunque il bonus pieno alla Forza.';
 }

 accBox.className = classe;
 accBox.innerHTML = testo; 
 }
 
 function recomputePrep(pg, tiers){

 recomputePrepTier(pg, tiers[i]); 
 }

 } 
 
 function prepReplacementReady(pg,tierKey){
   var entry=currentPozionarioEntry();
   if(entry){
     var idx=pgDataGet(pg,"prep_replaced_ing_"+tierKey,"");
     var qty=pgDataGet(pg,"prep_replaced_qty_"+tierKey,"");
     /* In una ricetta del Pozionario, il d14 fallito riguarda una precisa categoria di Classificazione:
        si può quindi sostituire soltanto un Ingrediente appartenente a quella fascia. Le voci davvero
        prive di Classificazione non appartengono a nessuno dei tre d14 e non vengono associate a intuito. */
     var selected=recipeIngredientByIndex(idx);
     if(!selected||ingredientTierKey(selected.c)!==tierKey){return false;}
     var selectedMax=replacementMaxForTier(pg,tierKey,selected);
     return selectedMax!==null&&intInRange(qty,1,selectedMax);
   }
   return positiveInt(pgDataGet(pg,"prep_replaced_qty_"+tierKey,""));
 }

 function recomputePrepTier(pg, tier){

 var tagEl = document.getElementById("prep-tag-" + tier.key + "-" + pg.id);

 var remedWrapEl = document.getElementById("prep-remedio-wrap-" + tier.key + "-" + pg.id);

 if(prepCopy){ prepCopy.disabled = calc.ready === false; }
 if(prepResultInput){ prepResultInput.disabled = calc.ready === false; }
 if(retryWrapEl){ retryWrapEl.style.display = "none"; retryWrapEl.innerHTML = ""; }

 if(calc.ready === false){
   if(formulaEl){ formulaEl.textContent = "In attesa: " + calc.waiting.join(", ") + "."; }

 }
 if(total >= 14){ 
   var previousPrepStatus=pgDataGet(pg,"prep_status_"+tier.key,"pending");
   if(resV!==""){
     delete pg.data["prep_result_"+tier.key];
     if(prepResultInput){prepResultInput.value="";}

     if(helpEnabled){
       if(helperType!=="studente" && helperType!=="adulto"){helpPending=true;if(helpTagEl){helpTagEl.textContent="Seleziona tipo aiutante";helpTagEl.className="out-tag out-neutral";}}
       else if(helperSpec==="V"){ helpSuccess=true; if(helpTagEl){helpTagEl.textContent="Si accorge dell'errore";helpTagEl.className="out-tag out-ok";} }
       else {

         var helpCodeEl=document.getElementById("prep-help-code-"+tier.key+"-"+pg.id);
         if(helpCodeEl){helpCodeEl.textContent="[dice=1d10]Aiuto nella Preparazione Ingredienti - "+helperName+" controlla l'errore di "+pg.nome+" ("+tier.label+", riesce se 1-"+helpSoglia+")[/dice]";}
         if(helpResV===""){helpPending=true;if(helpTagEl){helpTagEl.textContent="in attesa";helpTagEl.className="out-tag out-neutral";}}
         else if(!intInRange(helpResV,1,10)){helpPending=true;if(helpTagEl){helpTagEl.textContent="Risultato impossibile";helpTagEl.className="out-tag out-fail";}}
         else {helpSuccess=Number(helpResV)<=helpSoglia;if(helpTagEl){helpTagEl.textContent=helpSuccess?"Si accorge dell'errore":"Non se ne accorge";helpTagEl.className=helpSuccess?"out-tag out-ok":"out-tag out-fail";}}
       }
     }

 function votoCalderaioFixed(pg){
 var map = { T:1, D:2, S:3, A:4, O:5, E:6 };
 if(pg.tipo === "studente"){
  // Per gli Studenti il voto resta la base. Calderaio I aggiunge +1 al valore X
  // usato per stabilire la fascia del successivo 1d10.
  return map[pg.mediaPozioni] + levelNum(pg.calderaio);
 }
 var mapC = { I:7, II:8, III:9, IV:10, V:11 };
 if(levelNum(pg.calderaio) > 0){ return mapC[pg.calderaio]; }
 return null; // Adulto senza Calderaio: richiede 1d6
 } 
 
 function bracketFor(x){ 
 if(x >= 31){ return { z:"1", tt:"2", ss:"3-4", cc:"5-6-7-8-9-10" }; } 
 if(x >= 27){ return { z:"1", tt:"2", ss:"3-4-5", cc:"6-7-8-9-10" }; } 
 if(x >= 21){ return { z:"1-2", tt:"3-4", ss:"5-6-7", cc:"8-9-10" }; } 
 if(x >= 14){ return { z:"1-2-3", tt:"4-5", ss:"6-7", cc:"8-9-10" }; } 
 if(x >= 7){ return { z:"1-2-3", tt:"4-5-6", ss:"7-8", cc:"9-10" }; } 
 return { z:"1-2-3-4", tt:"5-6-7", ss:"8-9", cc:"10" }; 
 } 
 

function sintesiReductionInfo(pg){
 if(!extraIsUsed(pg,"sintesi")){ return { ready:true, percent:0, label:"Sintesi non usata" }; }
 var eff = normalizeExtraEfficacia(pg,"sintesi");
 if(eff === "pending"){ return { ready:false, percent:0, label:"Serve il 1d10 di Efficacia di Sintesi Tecnica+" }; }
 if(eff === "0"){ return { ready:true, percent:0, label:"Sintesi 0%: nessuna riduzione dei post (Fatica comunque spesa)" }; }
 var sapiente = pg.tipo === "adulto" && haSapienzaPozionistica(pg);
 if(sapiente){
   if(eff === "100"){ return { ready:true, percent:40, label:"Sintesi 100%: -40% post" }; }
   return { ready:false, percent:0, label:"Efficacia non prevista per Adulto con Sapienza Pozionistica 1+" };
 }
 if(pg.tipo === "studente") {
   if(eff === "100"){ return { ready:true, percent:20, label:"Sintesi 100%: -20% post" }; }
   if(eff === "33"){ return { ready:true, percent:10, label:"Sintesi 33%: -10% post" }; }
   if(eff === "66"){
     var d2s = pgDataGet(pg, "sintesi_d2", "");
     if(!intInRange(d2s,1,2)){ return { ready:false, percent:0, needsD2:true, label:"Sintesi 66%: serve 1d2 ×10%" }; }
     return { ready:true, percent:Number(d2s)*10, label:"Sintesi 66%: -" + (Number(d2s)*10) + "% post" };
   }
 } else {
   if(eff === "100"){ return { ready:true, percent:30, label:"Sintesi 100%: -30% post" }; }
   if(eff === "33"){ return { ready:true, percent:20, label:"Sintesi 33%: -20% post" }; }
   if(eff === "66"){
     var d2a = pgDataGet(pg, "sintesi_d2", "");
     if(!intInRange(d2a,1,2)){ return { ready:false, percent:0, needsD2:true, label:"Sintesi 66%: serve -10% -1d2×10%" }; }
     var pct = 10 + Number(d2a)*10;
     return { ready:true, percent:pct, label:"Sintesi 66%: -" + pct + "% post" };
   }
 }
 return { ready:false, percent:0, label:"Efficacia Sintesi non interpretabile" };
}

function applySintesiToPosts(pg, basePosts){
 var info = sintesiReductionInfo(pg);
 if(basePosts === null || basePosts === undefined){ return { ready:false, base:basePosts, exact:null, info:info }; }
 if(!info.ready){ return { ready:false, base:basePosts, exact:null, info:info }; }
 var exact = basePosts * (100 - info.percent) / 100;
 exact = Math.round(exact * 100) / 100;
 return { ready:true, base:basePosts, exact:exact, info:info, fractional:Math.floor(exact) !== exact };
}

function calderoneInfo(pg){
 var key=String(pgDataGet(pg,"calderone_usato","none")||"none");
 if(!Object.prototype.hasOwnProperty.call(CALDERONI_POZIONE,key)){key="none";}
 var x=CALDERONI_POZIONE[key];
 return {key:key,label:x.label,postPercent:Number(x.postPercent||0),postFloor:!!x.postFloor,doseExtra:Number(x.doseExtra||0),prodBonus:Number(x.prodBonus||0),healthMalus:Number(x.healthMalus||0),folding:!!x.folding,foldRisk:!!x.foldRisk,illegal:!!x.illegal};
}
function calderoneEffectText(info){
 if(!info||info.key==="none"){return "Seleziona qui l'eventuale Calderone o manufatto usato: il tool applicherà automaticamente i bonus previsti dal Prezzario nelle fasi corrette. I campi manuali delle fasi restano riservati ad altri Oggetti/Conoscenze.";}
 var a=[];
 if(info.prodBonus){a.push("+"+info.prodBonus+" possibilità in Produzione");}
 if(info.doseExtra){a.push("+"+info.doseExtra+" dosi");}
 if(info.postPercent){a.push("-"+info.postPercent+"% post"+(info.postFloor?" (post da sottrarre arrotondati per difetto)":""));}
 if(info.folding){a.push("permette di produrre fuori da un Laboratorio");}
 if(info.foldRisk){a.push("rischio: con 1 su 1d2 il calderone scoppia");}
 if(info.healthMalus){a.push("-"+info.healthMalus+" Salute al termine dell'utilizzo");}
 return info.label+": "+a.join("; ")+".";
}
function applyCalderoneToPosts(pg,posts){
 var info=calderoneInfo(pg);
 if(posts===null||posts===undefined){return {ready:false,base:posts,exact:null,info:info,fractional:false};}
 var exact;
 if(info.postFloor){
  /* “-N% di post per difetto”: arrotondiamo per difetto i post da sottrarre.
     Esempio: 17 post, -30% => floor(5.1)=5 post sottratti => 12 finali. */
  var reduction=Math.floor((posts*info.postPercent/100)+1e-9);
  exact=posts-reduction;
  exact=Math.round(exact*100)/100;
 }else{
  exact=posts*(100-info.postPercent)/100;
  exact=Math.round(exact*100)/100;
 }
 return {ready:true,base:posts,exact:exact,info:info,fractional:Math.floor(exact)!==exact};
}

 function imbottPostFinali(pg, esito){

 var classIndexMap = { X:0, XX:1, XXX:2, XXXX:3, XXXXX:4 };

 if(pg.tipo === "studente"){
   base100 = 28;

 } else {
   base100 = 16;
 }

 var esitoExtra = 0;

 if(esito === "33%"){ esitoExtra = 8; }

 return base100 + (idx * 4) + esitoExtra;
 }

 function esitoFromBracket(br, rv){
 if(!isFinite(rv) || Math.floor(rv) !== rv || rv < 1){ return "INVALIDO"; }
 if(rv > 10){ return "100%"; }
 var rvStr = String(rv);
 function inRange(rangeStr){
  var parts = rangeStr.split("-");
  for(var i=0;i<parts.length;i++){ if(parts[i] === rvStr){ return true; } }
  return false;
 }
 var matches = [];
 if(inRange(br.z)){ matches.push("0%"); }
 if(inRange(br.tt)){ matches.push("33%"); }
 if(inRange(br.ss)){ matches.push("66%"); }
 if(inRange(br.cc)){ matches.push("100%"); }
 if(matches.length === 0){ return "INVALIDO"; }
 if(matches.length > 1){ return "AMBIGUO"; }
 return matches[0];
 }

 function distillDefaultEntry(){
 return {eff:"skip",roll:"",retry_risk:"",retry_eff:"none",retry_roll:""};
 }
 
 function normalizeDistillEntries(pg){
 var entries = pg.data["distill_entries"];
 if(!Array.isArray(entries)){
   entries = [];
   var oldEff = pgDataGet(pg, "distill_eff", "skip");
   var oldRoll = pgDataGet(pg, "distill_roll", "");
   var oldRisk = pgDataGet(pg, "distill_retry_risk", "");
   var oldRetryEff = pgDataGet(pg, "distill_retry_eff", "none");
   var oldRetryRoll = pgDataGet(pg, "distill_retry_roll", "");
   if(oldEff !== "skip" || oldRoll !== "" || oldRisk !== "" || oldRetryEff !== "none" || oldRetryRoll !== ""){
     entries.push({eff:oldEff,roll:oldRoll,retry_risk:oldRisk,retry_eff:oldRetryEff,retry_roll:oldRetryRoll});
   }
 }
 var maxDosi = computeDosiFinali(pg).finale;
 if(!isFinite(maxDosi) || maxDosi < 0){ maxDosi = 0; }
 if(entries.length > maxDosi){ entries = entries.slice(0, maxDosi); }
 for(var i=0;i<entries.length;i++){
   var e = entries[i] || {};
   entries[i] = {
     eff: (e.eff === undefined ? "skip" : String(e.eff)),
     roll: (e.roll === undefined ? "" : String(e.roll)),
     retry_risk: (e.retry_risk === undefined ? "" : String(e.retry_risk)),
     retry_eff: (e.retry_eff === undefined ? "none" : String(e.retry_eff)),
     retry_roll: (e.retry_roll === undefined ? "" : String(e.retry_roll))
   };
 }
 pg.data["distill_entries"] = entries;
 return entries;
 }

 function distillSpaceFrom(pg, eff, roll){
 if(eff === "skip" || eff === "0"){ return "standard"; }
 var isStudente = (pg.tipo === "studente");
 var haSapienza = haSapienzaPozionistica(pg);
 if(isStudente){
   if(eff === "33"){ return "1/2"; }
   if(eff === "66"){ if(roll === 1){ return "1/2"; } if(roll === 2){ return "1/3"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/2"; } if(roll === 3){ return "1/3"; } }
 } else if(haSapienza){
   if(eff === "33"){ return "1/4"; }
   if(eff === "100"){ return "1/5"; }
   if(eff === "66"){ if(roll === 1){ return "1/4"; } if(roll === 2){ return "1/5"; } }
 } else {
   if(eff === "33"){ return "1/3"; }
   if(eff === "66"){ if(roll === 1){ return "1/3"; } if(roll === 2){ return "1/4"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/3"; } if(roll === 3){ return "1/4"; } }
 }
 return null;
 }

 function distillOutcomeSpec(pg, eff){
  if(eff === "0"){ return {fixed:"standard", faces:0, desc:"Distillazione fallita: la dose resta a spazio standard."}; }
  var stud = pg.tipo === "studente";
  var sap = haSapienzaPozionistica(pg);
  if(stud){
    if(eff === "33"){ return {fixed:"1/2", faces:0, desc:"Con Efficacia 33% la dose occupa 1/2 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/2 spazio, 2: dose = 1/3 spazio"}; }
    if(eff === "100"){ return {fixed:null, faces:3, desc:"1-2: dose = 1/2 spazio, 3: dose = 1/3 spazio"}; }
  } else if(sap){
    if(eff === "33"){ return {fixed:"1/4", faces:0, desc:"Con Efficacia 33% la dose occupa 1/4 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/4 spazio, 2: dose = 1/5 spazio"}; }
    if(eff === "100"){ return {fixed:"1/5", faces:0, desc:"Con Efficacia 100% la dose occupa 1/5 spazio."}; }
  } else {
    if(eff === "33"){ return {fixed:"1/3", faces:0, desc:"Con Efficacia 33% la dose occupa 1/3 spazio."}; }
    if(eff === "66"){ return {fixed:null, faces:2, desc:"1: dose = 1/3 spazio, 2: dose = 1/4 spazio"}; }
    if(eff === "100"){ return {fixed:null, faces:3, desc:"1-2: dose = 1/3 spazio, 3: dose = 1/4 spazio"}; }
  }
  return {fixed:null, faces:0, desc:"Esito non riconosciuto."};
 }

      entry.retry_roll = "";

  return space;

 function recomputeDistill(pg){ 
 var out = document.getElementById("distill-out-" + pg.id); 
 if(!out){ return; } 
 out.innerHTML = "";
 pg.data["distill_destroyed"] = false;
 pg.data["distill_destroyed_count"] = 0;
 pg.data["distill_invalid"] = false;
 pg.data["distill_attempts"] = 0;
 pg.data["distill_space"] = "standard";
 pg.data["distill_spaces"] = [];
 pg.data["distill_dose_count"] = 0;
 
 var entries = normalizeDistillEntries(pg);
 if(!entries.length){
   out.appendChild(el("p", "small-note", "Nessuna dose selezionata per la Distillazione: tutte le dosi restano a spazio standard."));
   updateFaticaBox(pg, "distill");
   return;
 }
 
 var spaces = [];
 var attempts = 0;
 var destroyed = 0;
 var invalid = false;
 var processed = 0;
 for(var i=0;i<entries.length;i++){
   var result = renderSingleDistillDose(out, pg, entries[i], i);
   if(result.processed){
     processed += 1;
     attempts += result.attempts;
     if(result.destroyed){ destroyed += 1; }
     else if(result.space !== null){ spaces.push(result.space); }
     if(result.invalid){ invalid = true; }
   }
 }
 
 pg.data["distill_attempts"] = attempts;
 pg.data["distill_dose_count"] = processed;
 pg.data["distill_destroyed_count"] = destroyed;
 pg.data["distill_destroyed"] = destroyed > 0;
 pg.data["distill_invalid"] = invalid;
 pg.data["distill_spaces"] = spaces;
 pg.data["distill_space"] = spaces.length ? spaces[0] : "standard";
 pg.data["distill_eff"] = processed ? (entries[0] && entries[0].eff ? entries[0].eff : "skip") : "skip";
 
 updateFaticaBox(pg, "distill");
 }

 function computeDispensaInfo(pg,tiersPresent){

   } else {var manual=pgDataGet(pg,"riep_dispensa_base_manual","");if(manual===""||!nonNegativeInt(manual)){complete=false;}else{base=Number(manual);}}
   for(var t=0;t<tiersPresent.length;t++){

       else{extra+=Number(sq);addItem(selected.n,Number(sq));replacementNotes.push(TIER_LABELS_MAP[key]+": sostituito "+selected.n+" ×"+Number(sq)+".");}
     } else {var mq=pgDataGet(pg,"prep_replaced_qty_"+key,"");if(!positiveInt(mq)){complete=false;replacementNotes.push(TIER_LABELS_MAP[key]+": quantità sostituita non ancora indicata.");}else{extra+=Number(mq);replacementNotes.push(TIER_LABELS_MAP[key]+": +"+Number(mq)+" unità/dosi sostituite.");}}
   }
   if(entry){
     var sourceTotals={};var sourceRefs={};
     for(var sti=0;sti<tiersPresent.length;sti++){var stKey=tiersPresent[sti];if(pgDataGet(pg,"prep_remedy_choice_"+stKey,"")!=="retry"){continue;}var stSrc=replacementSourceIngredient(pg,stKey);var stQty=pgDataGet(pg,"prep_replaced_qty_"+stKey,"");if(stSrc&&positiveInt(stQty)){sourceTotals[stSrc.idx]=(sourceTotals[stSrc.idx]||0)+Number(stQty);sourceRefs[stSrc.idx]=stSrc;}}
     for(var sid in sourceTotals){if(Object.prototype.hasOwnProperty.call(sourceTotals,sid)){var srcRef=sourceRefs[sid];if(srcRef&&sourceTotals[sid]>srcRef.q){complete=false;replacementNotes.push(srcRef.n+": sostituzioni complessive "+sourceTotals[sid]+", ma la ricetta ne contiene soltanto "+srcRef.q+". Riduci le quantità associate ai diversi d14.");}}}
   }
   var parts=[];if(entry){for(var j=0;j<order.length;j++){parts.push(order[j]+" ×"+map[order[j]]);}}
   return {complete:complete,base:base,extra:extra,total:base+extra,parts:parts,replacements:replacementNotes,nonNumerici:nonNumerici,esclusi:esclusi,automatic:!!entry,ongNonEligibleBase:ongNonEligibleBase,externalNumeric:externalNumeric,externalNumericTotal:externalNumericTotal};
 }
 
 function summarizeDistillationSpaces(spaces, standardCount, destroyedCount){
   var order = ["1/5","1/4","1/3","1/2","standard"];
   var counts = {"1/5":0,"1/4":0,"1/3":0,"1/2":0,"standard":0};
   if(Array.isArray(spaces)){
     for(var i=0;i<spaces.length;i++){
       var s = String(spaces[i] || "standard");
       if(!counts.hasOwnProperty(s)){ s = "standard"; }
       counts[s] += 1;
     }
   }
   if(standardCount > 0){ counts.standard += standardCount; }
   var parts = [];
   for(var j=0;j<order.length;j++){
     var key = order[j];
     var c = counts[key] || 0;
     if(c <= 0){ continue; }
     if(key === "standard"){
       parts.push(c + " " + (c === 1 ? "dose a spazio standard" : "dosi a spazio standard"));
     } else {
       parts.push(c + " " + (c === 1 ? "dose da " : "dosi da ") + key + " spazio");
     }
   }
   if(destroyedCount > 0){ parts.push(destroyedCount + " " + (destroyedCount === 1 ? "dose distrutta in Distillazione" : "dosi distrutte in Distillazione")); }
   if(!parts.length){ return "Standard"; }
   return parts.join("; ");
 }
 
 function ingredientiOngMaxKnown(dispensaInfo){

 function computeCategoriaPozione(forzaBaseRaw, categoriaForcePercent, forzaFlatBonus, valigettaFactor){
  var categoriaPercent = ((1 + categoriaForcePercent/100) * valigettaFactor - 1) * 100;
  var categoria = "Standard";
  if(forzaFlatBonus > 0 && !positiveInt(forzaBaseRaw)){
    return { categoria:"Da determinare (serve Forza Standard)", percent:categoriaPercent, needsBase:true };
  }
  if(positiveInt(forzaBaseRaw)){
    var baseCat = Number(forzaBaseRaw);
    var finaleCat = ((baseCat * (1 + categoriaForcePercent/100)) + forzaFlatBonus) * valigettaFactor;
    categoriaPercent = ((finaleCat - baseCat) / baseCat) * 100;
  }
  if(categoriaPercent >= 80){ categoria = "Eccezionale"; }
  else if(categoriaPercent >= 40){ categoria = "Oltre Ogni Previsione (OOP)"; }
  return { categoria:categoria, percent:categoriaPercent, needsBase:false };
 }
