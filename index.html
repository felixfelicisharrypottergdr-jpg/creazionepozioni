```
<div class="foglio"> 
<style>
/* ==========================================================
   CREAZIONE DI UNA POZIONE
   Peltro + verde acido + viola scuro
   Stile più ricco e leggibile, ispirato alla Ricerca Pazienti.
   Tutto circoscritto a .foglio per non toccare il resto del forum.
   ========================================================== */

.foglio{
  --bg:#171a1b;
  --bg2:#101213;
  --panel:#252a2b;
  --panel-hi:#2d3334;
  --panel2:#1e2223;
  --line:#505957;

  --acid:#9fbe28;
  --acid-soft:#d4e77d;
  --acid-dim:#7f9920;

  --purple:#35163f;
  --purple2:#482252;
  --purple-soft:#b89cc1;

  --text:#eeeae2;
  --text-dim:#bdbbb2;
  --text-soft:#d7d3c9;

  --danger:#c9687c;
  --danger-bg:#3a2027;

  --serif:'Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
  --mono:'Consolas','Courier New',monospace;

  /* alias usati dal JS/CSS preesistente */
  --parch:var(--text);
  --parch-dark:var(--text-dim);
  --ink:var(--text);
  --green:var(--purple);
  --green-dark:var(--acid);
  --gold:var(--acid);

  width:100% !important;
  max-width:none !important;
  min-height:100% !important;
  margin:0 !important;
  padding:0 0 72px 0 !important;
  box-sizing:border-box !important;

  background:
    radial-gradient(circle at 12% 0%, rgba(159,190,40,.09), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(72,34,82,.32), transparent 36%),
    linear-gradient(180deg,#202425 0%,#171a1b 68%,#121415 100%) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.55 !important;
}

.foglio,
.foglio *{
  box-sizing:border-box !important;
}

/* ---------- contenitore ---------- */

.foglio .wrap{
  width:96% !important;
  max-width:1180px !important;
  margin:0 auto !important;
  padding:42px 26px 72px !important;
}

/* ---------- testata ---------- */

.foglio .main-title{
  position:relative !important;
  margin:0 auto 8px !important;
  padding:0 20px !important;
  text-align:center !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:42px !important;
  line-height:1.15 !important;
  font-weight:400 !important;
  letter-spacing:.015em !important;
  text-shadow:0 2px 8px rgba(0,0,0,.45) !important;
}

.foglio .main-title:after{
  content:"" !important;
  display:block !important;
  width:110px !important;
  height:1px !important;
  margin:16px auto 0 !important;
  background:linear-gradient(90deg,transparent,var(--acid),transparent) !important;
}

.foglio .title-flask{
  display:inline-block !important;
  margin:0 10px !important;
  color:var(--acid-soft) !important;
  font-size:.62em !important;
  vertical-align:3px !important;
  text-shadow:0 0 10px rgba(159,190,40,.22) !important;
}

/* NON ridefiniamo :before di Font Awesome:
   il forum può già caricare correttamente l'icona fa-flask. */

.foglio .subtitle{
  max-width:720px !important;
  margin:0 auto 34px !important;
  text-align:center !important;
  color:var(--text-dim) !important;
  font-family:var(--serif) !important;
  font-size:16px !important;
  line-height:1.55 !important;
  font-weight:400 !important;
  font-style:italic !important;
}

/* ---------- navigazione ---------- */

.foglio .steps-nav{
  display:flex !important;
  flex-wrap:wrap !important;
  justify-content:center !important;
  gap:0 !important;
  width:100% !important;
  margin:0 0 32px !important;
  padding:0 10px !important;
  overflow:hidden !important;

  background:
    linear-gradient(180deg,rgba(72,34,82,.22),rgba(16,18,19,.96)) !important;
  border:1px solid var(--line) !important;
  border-radius:10px !important;
  box-shadow:0 8px 22px rgba(0,0,0,.22) !important;
}

.foglio button.step-btn{
  flex:1 1 135px !important;
  min-width:120px !important;
  min-height:51px !important;
  margin:0 !important;
  padding:15px 10px 13px !important;

  appearance:none !important;
  background:transparent !important;
  border:0 !important;
  border-bottom:3px solid transparent !important;
  border-radius:0 !important;
  box-shadow:none !important;

  color:var(--text-dim) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  font-weight:400 !important;
  line-height:1.35 !important;
  letter-spacing:.035em !important;
  text-transform:uppercase !important;
  text-shadow:none !important;
  cursor:pointer !important;
}

.foglio button.step-btn:hover{
  background:rgba(255,255,255,.035) !important;
  color:var(--text) !important;
}

.foglio button.step-btn.active{
  background:linear-gradient(180deg,rgba(159,190,40,.16),rgba(159,190,40,.05)) !important;
  border-bottom-color:var(--acid) !important;
  color:var(--acid-soft) !important;
}

/* ---------- pannello di ogni fase ---------- */

.foglio .panel{
  position:relative !important;
  width:100% !important;
  margin:0 0 24px !important;
  padding:30px 32px 32px !important;

  background:
    linear-gradient(180deg,var(--panel-hi) 0%,var(--panel) 100%) !important;
  border:1px solid var(--line) !important;
  border-radius:12px !important;
  box-shadow:
    0 14px 34px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.025) !important;

  color:var(--text) !important;
}

.foglio .panel:before{
  content:"" !important;
  position:absolute !important;
  top:-1px !important;
  left:28px !important;
  right:28px !important;
  height:2px !important;
  background:linear-gradient(90deg,transparent,var(--acid-dim),transparent) !important;
  opacity:.75 !important;
}

.foglio .panel h2{
  margin:0 0 9px !important;
  padding:0 0 0 15px !important;
  border:0 !important;
  border-left:3px solid var(--acid) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:26px !important;
  line-height:1.25 !important;
  font-weight:400 !important;
  letter-spacing:.01em !important;
  text-shadow:none !important;
}

.foglio .panel h3{
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:19px !important;
  font-weight:400 !important;
}

.foglio .panel p{
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.6 !important;
}

.foglio .panel b,
.foglio .panel strong{
  color:var(--acid-soft) !important;
  font-weight:600 !important;
}

/* ---------- testo introduttivo / note ---------- */

.foglio .guide-text{
  margin:16px 0 28px !important;
  padding:15px 18px !important;

  background:
    linear-gradient(90deg,rgba(53,22,63,.62),rgba(53,22,63,.25)) !important;
  border:0 !important;
  border-left:3px solid var(--acid) !important;
  border-radius:0 8px 8px 0 !important;

  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.6 !important;
}

/* ---------- righe / campi ---------- */

.foglio .row{
  display:flex !important;
  flex-wrap:wrap !important;
  align-items:flex-start !important;
  width:100% !important;
  column-gap:22px !important;
  row-gap:18px !important;
  margin:0 0 20px !important;
}

.foglio .row > div{
  flex:1 1 220px !important;
  min-width:190px !important;
}

.foglio label{
  display:block !important;
  margin:0 0 6px !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  line-height:1.35 !important;
  font-weight:400 !important;
  letter-spacing:.055em !important;
  text-transform:uppercase !important;
}

.foglio input[type="text"],
.foglio input[type="number"],
.foglio select,
.foglio textarea{
  width:100% !important;
  max-width:none !important;
  min-height:39px !important;
  margin:0 !important;
  padding:9px 11px !important;

  appearance:auto !important;
  background:var(--bg2) !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.35) !important;

  color:var(--text) !important;
  font-family:var(--mono) !important;
  font-size:13.5px !important;
  line-height:1.35 !important;
  font-weight:400 !important;
}

.foglio input[type="text"]:focus,
.foglio input[type="number"]:focus,
.foglio select:focus,
.foglio textarea:focus{
  outline:none !important;
  border-color:var(--acid) !important;
  box-shadow:
    0 0 0 2px rgba(159,190,40,.10),
    inset 0 1px 2px rgba(0,0,0,.35) !important;
}

.foglio select option{
  background:var(--bg2) !important;
  color:var(--text) !important;
}

.foglio input[type="checkbox"]{
  width:16px !important;
  height:16px !important;
  min-height:0 !important;
  margin:0 !important;
  padding:0 !important;
  accent-color:var(--acid) !important;
}

.foglio .chk-line{
  display:flex !important;
  align-items:center !important;
  gap:9px !important;
  margin:9px 0 !important;
  padding:4px 0 !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.45 !important;
}

.foglio .chk-line span{
  color:var(--text) !important;
}

/* ---------- divisori ---------- */

.foglio .divider{
  height:1px !important;
  margin:26px 0 22px !important;
  padding:0 !important;
  border:0 !important;
  background:linear-gradient(90deg,var(--line),rgba(80,89,87,.28),transparent) !important;
}

/* ---------- schede personaggio ---------- */

.foglio .pg-card{
  position:relative !important;
  margin:0 0 20px !important;
  padding:22px 24px !important;

  background:
    linear-gradient(180deg,rgba(53,22,63,.20),rgba(30,34,35,.96) 30%) !important;
  border:1px solid var(--line) !important;
  border-radius:9px !important;
  box-shadow:0 7px 20px rgba(0,0,0,.18) !important;

  color:var(--text) !important;
}

.foglio .pg-card:before{
  content:"" !important;
  position:absolute !important;
  left:-1px !important;
  top:18px !important;
  bottom:18px !important;
  width:3px !important;
  border-radius:3px !important;
  background:var(--acid) !important;
  opacity:.65 !important;
}

.foglio .pg-card h3{
  display:flex !important;
  align-items:center !important;
  justify-content:space-between !important;
  gap:14px !important;

  margin:0 0 20px !important;
  padding:0 0 10px !important;
  border-bottom:1px solid rgba(80,89,87,.78) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:20px !important;
  font-weight:400 !important;
}

.foglio .pg-card > p{
  margin:18px 0 16px !important;
  color:var(--text-soft) !important;
  font-size:14.5px !important;
}

.foglio .pg-card > p b{
  color:var(--acid-soft) !important;
  font-size:16px !important;
  font-weight:400 !important;
}

/* ---------- pulsanti ---------- */

.foglio button.action{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  gap:8px !important;

  min-height:40px !important;
  margin:10px 8px 0 0 !important;
  padding:10px 18px !important;

  appearance:none !important;
  background:
    linear-gradient(180deg,var(--purple2),var(--purple)) !important;
  border:1px solid var(--acid-dim) !important;
  border-radius:7px !important;
  box-shadow:0 3px 8px rgba(0,0,0,.16) !important;

  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  font-weight:400 !important;
  line-height:1.2 !important;
  text-shadow:none !important;
  cursor:pointer !important;
}

.foglio button.action:hover{
  background:
    linear-gradient(180deg,#52265e,#3c1b47) !important;
  border-color:var(--acid) !important;
  color:#fff !important;
}

.foglio button.action.danger{
  background:transparent !important;
  border-color:var(--danger) !important;
  color:#e7a9b6 !important;
}

.foglio button.action.danger:hover{
  background:var(--danger-bg) !important;
  color:#ffd0da !important;
}

/* ---------- dadi / copia ---------- */

.foglio .dice-box,
.foglio .result-line{
  display:flex !important;
  align-items:center !important;
  flex-wrap:wrap !important;
  gap:10px !important;
  margin:12px 0 !important;
}

.foglio .dice-code{
  flex:1 1 420px !important;
  min-height:43px !important;
  padding:10px 12px !important;

  background:var(--bg2) !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:12.5px !important;
  line-height:1.45 !important;
  overflow-wrap:anywhere !important;
}

.foglio button.copy-btn{
  flex:0 0 auto !important;
  min-width:76px !important;
  min-height:41px !important;
  margin:0 !important;
  padding:0 15px !important;

  appearance:none !important;
  background:rgba(53,22,63,.70) !important;
  border:1px solid var(--acid-dim) !important;
  border-radius:6px !important;
  box-shadow:none !important;

  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  text-transform:uppercase !important;
  letter-spacing:.04em !important;
  cursor:pointer !important;
}

.foglio button.copy-btn:hover{
  background:var(--purple2) !important;
  border-color:var(--acid) !important;
}

.foglio .result-line > span:first-child{
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14px !important;
}

.foglio .result-line input[type="number"]{
  flex:0 0 88px !important;
  width:88px !important;
  max-width:88px !important;
  text-align:center !important;
}

/* ---------- tag esito ---------- */

.foglio .out-tag{
  display:inline-block !important;
  padding:5px 11px !important;
  border:1px solid var(--line) !important;
  border-radius:18px !important;

  font-family:var(--mono) !important;
  font-size:11px !important;
  font-weight:400 !important;
  letter-spacing:.035em !important;
}

.foglio .out-ok{
  background:rgba(159,190,40,.09) !important;
  border-color:var(--acid) !important;
  color:var(--acid-soft) !important;
}

.foglio .out-fail{
  background:rgba(201,104,124,.09) !important;
  border-color:var(--danger) !important;
  color:#e7a9b6 !important;
}

.foglio .out-neutral{
  background:transparent !important;
  border-color:var(--line) !important;
  color:var(--text-dim) !important;
}

/* ---------- formule / note minori ---------- */

.foglio .formula-tag{
  display:inline-block !important;
  margin:5px 0 8px !important;
  padding:5px 9px !important;

  background:rgba(53,22,63,.52) !important;
  border:1px solid rgba(159,190,40,.33) !important;
  border-radius:6px !important;

  color:var(--text-soft) !important;
  font-family:var(--mono) !important;
  font-size:11.5px !important;
}

.foglio .small-note{
  margin:7px 0 12px !important;
  color:var(--text-dim) !important;
  font-size:13px !important;
  line-height:1.5 !important;
}



/* ---------- esito complessivo Preparazione Ingredienti ---------- */

.foglio .prep-summary-box{
  margin:18px 0 4px !important;
  padding:15px 17px !important;
  background:rgba(16,18,19,.55) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:7px !important;
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  line-height:1.55 !important;
}
.foglio .prep-summary-box.success{ background:rgba(159,190,40,.09) !important; border-left-color:var(--acid) !important; }
.foglio .prep-summary-box.fail{ background:rgba(201,104,124,.09) !important; border-left-color:var(--danger) !important; }
.foglio .prep-summary-box.warning{ background:rgba(184,156,193,.08) !important; border-left-color:var(--purple-soft) !important; }
.foglio .prep-summary-box .prep-main{ display:block !important; margin-bottom:5px !important; color:var(--text) !important; font-size:16px !important; }
.foglio .prep-summary-box.success .prep-main{ color:var(--acid-soft) !important; }
.foglio .prep-summary-box.fail .prep-main{ color:#ef9aab !important; }

.foglio .inventory-box{
  margin:20px 0 14px !important;
  padding:16px 17px !important;
  background:linear-gradient(90deg,rgba(53,22,63,.45),rgba(16,18,19,.76)) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:8px !important;
}
.foglio .inventory-label{
  display:block !important;
  margin:0 0 10px !important;
  color:var(--acid-soft) !important;
  font-family:var(--mono) !important;
  font-size:11px !important;
  letter-spacing:.055em !important;
  text-transform:uppercase !important;
}
.foglio .inventory-sentence{
  width:100% !important;
  margin:0 !important;
  padding:14px 15px !important;
  background:#111415 !important;
  border:1px solid var(--line) !important;
  border-radius:6px !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.55 !important;
  overflow-wrap:anywhere !important;
}


/* ---------- Fatica / consapevolezza del calderone ---------- */

.foglio .fatigue-box{
  margin:20px 0 6px !important;
  padding:14px 16px !important;
  background:linear-gradient(90deg,rgba(53,22,63,.48),rgba(16,18,19,.58)) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--purple-soft) !important;
  border-radius:7px !important;
  color:var(--text-soft) !important;
  font-family:var(--serif) !important;
  font-size:14.5px !important;
  line-height:1.55 !important;
}

.foglio .fatigue-box b{
  color:var(--acid-soft) !important;
  font-size:16px !important;
}

.foglio .fatigue-box.zero{
  background:rgba(159,190,40,.08) !important;
  border-left-color:var(--acid) !important;
}

.foglio .awareness-box{
  margin:16px 0 8px !important;
  padding:15px 17px !important;
  background:rgba(53,22,63,.24) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--purple-soft) !important;
  border-radius:8px !important;
}

.foglio .awareness-box .awareness-title{
  margin:0 0 8px !important;
  color:var(--acid-soft) !important;
  font-family:var(--serif) !important;
  font-size:16px !important;
}


/* ---------- post finali Step 6 ---------- */

.foglio .final-posts-box{
  margin:14px 0 8px !important;
  padding:14px 16px !important;
  background:linear-gradient(90deg,rgba(159,190,40,.12),rgba(53,22,63,.22)) !important;
  border:1px solid rgba(159,190,40,.42) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:7px !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:15px !important;
  line-height:1.5 !important;
}

.foglio .final-posts-box b{
  color:var(--acid-soft) !important;
  font-size:17px !important;
}

.foglio .final-posts-box.fail{
  background:rgba(201,104,124,.09) !important;
  border-color:rgba(201,104,124,.55) !important;
  border-left-color:var(--danger) !important;
}

/* ---------- scheda riassuntiva finale ---------- */

.foglio .potion-summary{
  margin:18px 0 22px !important;
  padding:18px !important;
  background:
    linear-gradient(135deg,rgba(159,190,40,.08),rgba(53,22,63,.24)),
    var(--panel2) !important;
  border:1px solid var(--line) !important;
  border-left:4px solid var(--acid) !important;
  border-radius:9px !important;
}

.foglio .potion-summary-title{
  margin:0 0 14px !important;
  padding:0 0 10px !important;
  border-bottom:1px solid rgba(80,89,87,.75) !important;
  color:var(--acid-soft) !important;
  font-family:var(--serif) !important;
  font-size:18px !important;
  font-weight:400 !important;
}

.foglio .potion-summary-grid{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  gap:12px !important;
}

.foglio .summary-stat{
  min-width:0 !important;
  padding:13px 14px !important;
  background:rgba(16,18,19,.66) !important;
  border:1px solid var(--line) !important;
  border-radius:7px !important;
}

.foglio .summary-stat-label{
  display:block !important;
  margin:0 0 6px !important;
  color:var(--text-dim) !important;
  font-family:var(--mono) !important;
  font-size:10.5px !important;
  line-height:1.3 !important;
  letter-spacing:.045em !important;
  text-transform:uppercase !important;
}

.foglio .summary-stat-value{
  display:block !important;
  color:var(--text) !important;
  font-family:var(--serif) !important;
  font-size:17px !important;
  line-height:1.25 !important;
  overflow-wrap:anywhere !important;
}

.foglio .summary-stat-value.accent{
  color:var(--acid-soft) !important;
}

@media (max-width:950px){
  .foglio .potion-summary-grid{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }

 function fallbackCopyText(txt){

 ta.style.position = "fixed"; 
 ta.style.top = "0"; 
 ta.style.left = "-9999px";

 flashCopied(btn, true);

 flashCopied(btn, ok); 
 }); 
 } 
 }

 flashCopied(btn, ok2);

 function computePrepAccumulo(pg, tiersList){ 
 var allSuccess = true; 
 var anyUnremFail = false; 
 var anyIncomplete = false; 
 if(tiersList.length === 0){ allSuccess = false; anyIncomplete = true; } 
 for(var i=0;i<tiersList.length;i++){ 
 var st = pgDataGet(pg, "prep_status_" + tiersList[i], "pending"); 
 if(st === "pending"){ anyIncomplete = true; } 
 if(st === "fail_pending"){ anyIncomplete = true; } 
 if(st !== "success"){ allSuccess = false; } 
 if(st === "fail_unremediated"){ anyUnremFail = true; } 
 } 
 var forza = 0; 
 var durata = 0; 
 if(allSuccess){ forza = prepForzaBonusPercent(pg); } 
 if(anyUnremFail){ durata = 0 - prepMalusPercent(pg); } 
 return { forza: forza, durata: durata, complete: !anyIncomplete, allSuccess: allSuccess }; 
 } 
 
 function computeProdAccumulo(pg){ 
 var status = pgDataGet(pg, "prod_status", "pending"); 
 var forza = 0; 
 if(status === "success"){ forza = prodForzaBonusPercent(pg); } 
 if(status === "fail"){ forza = 0 - prodMalusPercent(pg); } 
 return { forza: forza, complete: status !== "pending" }; 
 } 
 
 function computeDosiFinali(pg){ 
 var dosiBase = pgDataGet(pg, "dosi_base_total", null); 
 var bacStatus = pgDataGet(pg, "bac_status", "pending"); 
 if(dosiBase === null){ 
 return { finale: null, testo: "da calcolare (tira ancora il dado delle Dosi)" }; 
 } 
 var finale = dosiBase; 
 var testo = "" + dosiBase + " (base)"; 
 if(bacStatus === "fail"){ 
 finale = finale - 1; 
 if(finale < 0){ finale = 0; } 
 testo = "" + finale + " (base " + dosiBase + ", -1 per fallimento dell'Uso della Bacchetta)"; 
 } else if(bacStatus === "pending"){ 
 testo = "" + dosiBase + " (base, provvisorio: dipende dall'esito dell'Uso della Bacchetta qui sopra)"; 
 } else { 
 testo = "" + finale + " (base " + dosiBase + ", nessuna penalità: Uso della Bacchetta riuscito)"; 
 } 
 return { finale: finale, testo: testo }; 
 }

 function calcPrepTier(pg, tier){
 var tecBase = tecnicaBasePrep(pg.tecnica);
 var votoB = getVotoBonus(pg);
 var d6 = pgDataGet(pg, "prep_d6", "");
 var adultoNoSpezialeBonus = 0;

 if(pg.tipo === "adulto"){
   if(levelNum(pg.speziale) === 0){
     if(d6 !== ""){ adultoNoSpezialeBonus = num(d6,0) - 4; }
   }
 }

 var spezialeB = levelNum(pg.speziale);
 var classB = tierBonusPrep(tier.key);

 var extraObj = extraBonusStatic(pg, "manualita", pg.manualita);
 var manFixed = extraObj.fixed;

 if(extraObj.diceFaces > 0){
   var dv = pgDataGet(pg, "prep_man_dice", "");
   if(dv !== ""){
     manFixed = manFixed + num(dv,0);
   } else {
     manFixed = 0;
   }
 }

 var extraManual = num(pgDataGet(pg, "prep_extra_" + tier.key, 0), 0);

 var votoTotale = votoB + adultoNoSpezialeBonus + spezialeB;
 var extraTotale = manFixed + extraManual;
 var total = tecBase + votoTotale + classB + extraTotale;

 if(total > 14){ total = 14; }
 if(total < 0){ total = 0; }

 return {
   tecBase: tecBase,
   votoTotale: votoTotale,
   classB: classB,
   extraTotale: extraTotale,
   total: total
 };
 }

 function refreshPrepAccumulo(pg){ 
 var accBox = document.getElementById("prep-accumulo-" + pg.id); 
 if(!accBox){ return; } 

 var tiersList = getTiersPresentList(); 
 var acc = computePrepAccumulo(pg, tiersList);
 var bonusPerfetto = prepForzaBonusPercent(pg);
 var malusErrore = prepMalusPercent(pg);

 var hasRemediated = false;
 var hasUnremediated = false;
 var hasPending = false;

 for(var i=0;i<tiersList.length;i++){
   var st = pgDataGet(pg, "prep_status_" + tiersList[i], "pending");
   if(st === "fail_remediated"){ hasRemediated = true; }
   if(st === "fail_unremediated"){ hasUnremediated = true; }
   if(st === "pending" || st === "fail_pending"){ hasPending = true; }
 }

 var testo = "";
 var classe = "prep-summary-box";

 if(acc.complete && acc.allSuccess){
   classe += " success";
   testo =
     '<span class="prep-main"><b>Tutte le preparazioni sono riuscite: +' + bonusPerfetto + '% alla Forza della Pozione.</b></span>' +
     'Nessun malus alla Durata.';
 } else if(hasUnremediated){
   classe += " fail";
   testo =
     '<span class="prep-main"><b>Almeno una preparazione è fallita senza essere rimediata: -' + malusErrore + '% alla Durata degli effetti e dei bonus/malus.</b></span>' +
     'Il bonus di +' + bonusPerfetto + '% alla Forza non si applica, perché per ottenerlo devono riuscire tutte le preparazioni.';
 } else if(hasRemediated && !hasPending){
   classe += " warning";
   testo =
     '<span class="prep-main"><b>Una o più preparazioni sono fallite, ma l’errore è stato rimediato.</b></span>' +
     'Nessun malus alla Durata; il bonus di +' + bonusPerfetto + '% alla Forza però non si applica.';
 } else {
   classe += " warning";
   testo =
     '<span class="prep-main"><b>Esito complessivo ancora da determinare.</b></span>' +
     'Se <b>tutte</b> le preparazioni riusciranno: <b>+' + bonusPerfetto + '% Forza</b>. ' +
     'Se almeno una preparazione fallirà e l’errore non verrà rimediato: <b>-' + malusErrore + '% Durata</b>. ' +
     'Se l’errore viene rimediato, non si applica il malus, ma si perde comunque il bonus pieno alla Forza.';
 }

 accBox.className = classe;
 accBox.innerHTML = testo; 
 }

 function recomputePrepTier(pg, tier){
 var calc = calcPrepTier(pg, tier);
 var tecBase = calc.tecBase;
 var votoTotale = calc.votoTotale;
 var classB = calc.classB;
 var extraTotale = calc.extraTotale;
 var total = calc.total;

 var formulaEl = document.getElementById("prep-formula-" + tier.key + "-" + pg.id); 
 if(formulaEl){ 
 formulaEl.textContent = "Tecnica " + tecBase + " + Voto/Speziale " + votoTotale +
 " + Classificazione " + classB + " + Extra " + extraTotale + " = " + total + " su 14"; 
 } 

 var codeEl = document.getElementById("prep-code-" + tier.key + "-" + pg.id); 
 if(codeEl){ codeEl.textContent = prepDiceText(pg, tier, calc); } 

 var tagEl = document.getElementById("prep-tag-" + tier.key + "-" + pg.id); 
 var conseqEl = document.getElementById("prep-conseq-" + tier.key + "-" + pg.id); 
 var remedWrapEl = document.getElementById("prep-remedio-wrap-" + tier.key + "-" + pg.id); 
 var tierStatus = "pending"; 
 var resV = pgDataGet(pg, "prep_result_" + tier.key, ""); 

 if(total >= 14){ 
 tierStatus = "success"; 
 if(tagEl){ tagEl.textContent = "Automaticamente riuscita"; tagEl.className = "out-tag out-ok"; } 
 if(conseqEl){ conseqEl.textContent = "Ingredienti preparati correttamente."; } 
 if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else if(resV === ""){ 
 tierStatus = "pending"; 
 if(tagEl){ tagEl.textContent = "in attesa"; tagEl.className = "out-tag out-neutral"; } 
 if(conseqEl){ conseqEl.textContent = ""; } 
 if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else { 
 var rv = num(resV, 0); 
 var successo = (rv >= 1 && rv <= total); 

 if(successo){ 
 tierStatus = "success"; 
 if(tagEl){ tagEl.textContent = "Riuscita"; tagEl.className = "out-tag out-ok"; } 
 if(conseqEl){ conseqEl.textContent = "Ingredienti preparati correttamente."; } 
 if(remedWrapEl){ remedWrapEl.style.display = "none"; } 
 } else { 
 if(tagEl){ tagEl.textContent = "Fallita"; tagEl.className = "out-tag out-fail"; } 
 if(remedWrapEl){ remedWrapEl.style.display = "block"; } 

 if(pg.speziale === "V"){ 
 tierStatus = "fail_remediated"; 
 if(conseqEl){ 
 conseqEl.textContent = "Ingrediente sostituito grazie a Speziale V: nessun malus alla Durata, ma il bonus complessivo di +" + 
 prepForzaBonusPercent(pg) + "% alla Forza non si applica più."; 
 } 
 } else { 
 var accResV = pgDataGet(pg, "prep_acc_result_" + tier.key, ""); 
 var soglia = accorgersiPrepSoglia(pg); 
 var accTagEl = document.getElementById("prep-acc-tag-" + tier.key + "-" + pg.id); 
 var selfPending = false; 
 var selfSuccess = false; 

 if(accResV === ""){ 
 selfPending = true; 
 if(accTagEl){ accTagEl.textContent = "in attesa"; accTagEl.className = "out-tag out-neutral"; } 
 } else { 
 var accRv = num(accResV, 0); 
 selfSuccess = (accRv >= 1 && accRv <= soglia); 
 if(accTagEl){ 
 if(selfSuccess){ accTagEl.textContent = "Se ne accorge"; accTagEl.className = "out-tag out-ok"; } 
 else { accTagEl.textContent = "Non se ne accorge"; accTagEl.className = "out-tag out-fail"; }

 var helpEnabled = !!pgDataGet(pg, "prep_help_enabled_" + tier.key, false); 
 var helpSuccess = false; 
 var helpPending = false; 
 var helperName = pgDataGet(pg, "prep_help_name_" + tier.key, ""); 
 if(helperName === ""){ helperName = "Il PG aiutante"; } 
 var helperSpec = pgDataGet(pg, "prep_help_speziale_" + tier.key, "0"); 
 var helpTagEl = document.getElementById("prep-help-tag-" + tier.key + "-" + pg.id); 

 if(helpEnabled){ 
 if(helperSpec === "V"){ 
 helpSuccess = true; 
 if(helpTagEl){ helpTagEl.textContent = "Aiuto riuscito"; helpTagEl.className = "out-tag out-ok"; } 
 } else { 
 var helpSoglia = accorgersiPrepSogliaAiutante(helperSpec); 
 var helpResV = pgDataGet(pg, "prep_help_acc_result_" + tier.key, ""); 
 var helpCodeEl = document.getElementById("prep-help-code-" + tier.key + "-" + pg.id); 
 if(helpCodeEl){ 
 helpCodeEl.textContent = "[dice=1d10]Aiuto nella Preparazione Ingredienti - " + helperName + 
 " controlla l'errore di " + pg.nome + " (" + tier.label + ", riesce se 1-" + helpSoglia + ")[/dice]"; 
 } 
 if(helpResV === ""){ 
 helpPending = true; 
 if(helpTagEl){ helpTagEl.textContent = "in attesa"; helpTagEl.className = "out-tag out-neutral"; } 
 } else { 
 var helpRv = num(helpResV, 0); 
 helpSuccess = (helpRv >= 1 && helpRv <= helpSoglia); 
 if(helpTagEl){ 
 if(helpSuccess){ helpTagEl.textContent = "Si accorge dell'errore"; helpTagEl.className = "out-tag out-ok"; } 
 else { helpTagEl.textContent = "Non se ne accorge"; helpTagEl.className = "out-tag out-fail"; } 
 } 
 } 
 } 
 } 

 if(selfSuccess || helpSuccess){ 
 tierStatus = "fail_remediated"; 
 var chi = selfSuccess ? pg.nome : helperName; 
 if(selfSuccess && helpSuccess){ chi = pg.nome + " e " + helperName; } 
 if(conseqEl){ 
 conseqEl.textContent = chi + " si accorge dell'errore in tempo: l'ingrediente viene sostituito. " + 
 "Nessun malus alla Durata, ma il bonus complessivo di +" + prepForzaBonusPercent(pg) + 
 "% alla Forza non si applica più."; 
 } 
 } else if(selfPending || (helpEnabled && helpPending)){ 
 tierStatus = "fail_pending"; 
 if(conseqEl){ 
 var testoPending = "Preparazione fallita. L'errore può ancora essere individuato"; 
 if(helpEnabled){ testoPending = testoPending + " dal PG che prepara oppure dal PG aiutante"; } 
 else { testoPending = testoPending + " dal PG che prepara"; } 
 conseqEl.textContent = testoPending + ". Se nessuno se ne accorge: -" + prepMalusPercent(pg) + 
 "% alla Durata degli effetti e dei bonus/malus. Se qualcuno riesce a rimediare, il malus non si applica, " + 
 "ma il bonus complessivo di +" + prepForzaBonusPercent(pg) + "% alla Forza viene comunque perso."; 
 } 
 } else { 
 tierStatus = "fail_unremediated"; 
 var malusV = prepMalusPercent(pg); 
 if(conseqEl){ 
 conseqEl.textContent = "Nessuno si accorge dell'errore: malus di -" + malusV + 
 "% sulla Durata degli effetti e dei bonus/malus della Pozione."; 
 } 
 } 
 } 
 } 
 } 

 pg.data["prep_status_" + tier.key] = tierStatus; 
 refreshPrepAccumulo(pg); 
 }

 function recomputeProd(pg){ 
 var tecBase = pg.tecnica; 
 var chimicoB = chimicoBonusFixed(pg); 
 var classB = classBonusProd(POZ.classificazione); 
 var memExtra = extraBonusStatic(pg, "memoria", pg.memoria); 
 var memFixed = memExtra.fixed; 
 if(memExtra.diceFaces > 0){ 
 var dv = pgDataGet(pg, "prod_mem_dice", ""); 
 if(dv !== ""){ memFixed = memFixed + num(dv,0); } else { memFixed = 0; } 
 } 
 var extraManual = num(pgDataGet(pg, "prod_extra", 0), 0); 
 
 var total = tecBase + chimicoB + classB + memFixed + extraManual; 
 if(total > 30){ total = 30; } 
 if(total < 0){ total = 0; } 
 
 var formulaEl = document.getElementById("prod-formula-" + pg.id); 
 if(formulaEl){ 
 formulaEl.textContent = "Tecnica " + tecBase + " + Voto/Chimico " + chimicoB + " + Classificazione " + classB + 
 " + Extra " + (memFixed+extraManual) + " = " + total + " su 30"; 
 } 
 
 var codeEl = document.getElementById("prod-code-" + pg.id); 
 if(codeEl){ 
 codeEl.textContent = "[dice=1d30]Produzione Pozione - " + pg.nome + 
 " (Riesce se 1-" + total + ": Tecnica " + tecBase + " + Voto/Chimico " + chimicoB + 
 " + Classificazione " + classB + " + Extra " + (memFixed+extraManual) + " = " + total + " su 30)[/dice]"; 
 } 
 
 var tagEl = document.getElementById("prod-tag-" + pg.id); 
 var conseqEl = document.getElementById("prod-conseq-" + pg.id); 
 var status = "pending"; 
 var bonusP = prodForzaBonusPercent(pg); 
 var malusP = prodMalusPercent(pg); 
 if(tagEl){ 
 var resV = pgDataGet(pg, "prod_result", ""); 
 if(resV === "" ){ 
 if(total >= 30){ 
 tagEl.textContent = "Automaticamente riuscita"; 
 tagEl.className = "out-tag out-ok"; 
 status = "success"; 
 if(conseqEl){ conseqEl.textContent = "Produzione riuscita: bonus di +" + bonusP + "% sulla Forza finale della Pozione."; } 
 } else { 
 tagEl.textContent = "in attesa"; 
 tagEl.className = "out-tag out-neutral"; 
 if(conseqEl){ conseqEl.textContent = ""; } 
 } 
 } else { 
 var rv = num(resV, 0); 
 var successo = false; 
 if(rv >= 1){ 
 if(rv <= total){ 
 successo = true; 
 } 
 } 
 if(successo){ 
 tagEl.textContent = "Riuscita"; 
 tagEl.className = "out-tag out-ok"; 
 status = "success"; 
 if(conseqEl){ conseqEl.textContent = "Produzione riuscita: bonus di +" + bonusP + "% sulla Forza finale della Pozione."; } 
 } else { 
 tagEl.textContent = "Fallita"; 
 tagEl.className = "out-tag out-fail"; 
 status = "fail"; 
 if(conseqEl){ conseqEl.textContent = "Produzione fallita, irrimediabile: malus di -" + malusP + "% sulla Forza finale della Pozione."; } 
 } 
 } 
 } 
 pg.data["prod_status"] = status; 
 
 var accBox = document.getElementById("prod-accumulo-" + pg.id); 
 if(accBox){ 
 var tiersList = getTiersPresentList(); 
 var prepAcc = computePrepAccumulo(pg, tiersList); 
 var prodAcc = computeProdAccumulo(pg); 
 var totalForza = prepAcc.forza + prodAcc.forza; 
 var testo = "<b>Situazione accumulata dopo la Produzione</b><br>"; 
 testo = testo + "Modificatore di Forza totale finora: " + fmtPct(totalForza) + 
 " (Preparazione: " + fmtPct(prepAcc.forza) + " + Produzione: " + fmtPct(prodAcc.forza) + ")<br>"; 
 testo = testo + "Modificatore di Durata degli effetti/bonus-malus (dalla Preparazione): " + fmtPct(prepAcc.durata); 
 if(!prepAcc.complete){

 } 
 if(!prodAcc.complete){ 
 testo = testo + "<br><i>La Produzione non ha ancora un risultato: questo valore è provvisorio.</i>"; 
 } 
 accBox.innerHTML = testo;

 function votoCalderaioFixed(pg){ 
 if(pg.tipo === "studente"){ 
 var map = { T:1, D:2, S:3, A:4, O:5, E:6 }; 
 return map[pg.voto]; 
 } 
 if(levelNum(pg.calderaio) === 0){ return null; } // richiede 1d6 
 var mapC = { I:7, II:8, III:9, IV:10, V:11 }; 
 return mapC[pg.calderaio]; 
 } 
 
 function bracketFor(x){ 
 if(x >= 31){ return { z:"1", tt:"2", ss:"3-4", cc:"5-6-7-8-9-10" }; } 
 if(x >= 27){ return { z:"1", tt:"2", ss:"3-4-5", cc:"6-7-8-9-10" }; } 
 if(x >= 21){ return { z:"1-2", tt:"3-4", ss:"5-6-7", cc:"8-9-10" }; } 
 if(x >= 14){ return { z:"1-2-3", tt:"4-5-6", ss:"6-7", cc:"8-9-10" }; } 
 if(x >= 7){ return { z:"1-2-3", tt:"4-5-6", ss:"7-8", cc:"9-10" }; } 
 return { z:"1-2-3-4", tt:"5-6-7", ss:"8-9", cc:"10" }; 
 } 
 

 function imbottPostFinali(pg, esito){
 if(esito === "" || esito === "0%"){ return null; }

 var classIndexMap = { X:0, XX:1, XXX:2, XXXX:3, XXXXX:4 };
 var idx = classIndexMap[POZ.classificazione];
 if(idx === undefined){ idx = 0; }

 var base100;
 if(pg.tipo === "studente"){
   base100 = 28;
 } else if(levelNum(pg.calderaio) > 0){
   base100 = 4;
 } else {
   base100 = 16;
 }

 var esitoExtra = 0;
 if(esito === "66%"){ esitoExtra = 4; }
 if(esito === "33%"){ esitoExtra = 8; }

 return base100 + (idx * 4) + esitoExtra;
 }

 function imbottProfiloPost(pg){
 if(pg.tipo === "studente"){ return "Studente"; }
 if(levelNum(pg.calderaio) > 0){ return "Adulto con Calderaio"; }
 return "Adulto senza Calderaio";
 }

 function calderaioAwarenessSoglia(pg){
 if(pg.calderaio === "V"){ return 10; }
 var bonus = levelNum(pg.calderaio);
 var soglia = 5 + bonus;
 if(soglia > 9){ soglia = 9; }
 return soglia;
 }

 if(!wrap){ return; }

 if(esito !== "33%" && esito !== "66%"){
   wrap.style.display = "none";
   pg.data["imb_awareness"] = "not_applicable";
   return;
 }

 wrap.style.display = "block";
 var box = el("div", "awareness-box");
 box.appendChild(el("div", "awareness-title", "Il PG si accorge che calderone e postazione impiegheranno più tempo?"));
 box.appendChild(el("p", "small-note",
   "Con esito " + esito + " la Pozione è pronta all'uso, ma la postazione richiede " + imbPosts +
   " post finali. Accorgersene non riduce automaticamente i post: non si può porvi rimedio se non tramite eventuali Oggetti previsti dal regolamento."));

 if(pg.calderaio === "V"){
   pg.data["imb_awareness"] = "noticed";
   box.appendChild(el("div", "result-line",
     "<span>Calderaio V: il PG se ne accorge autoconclusivamente.</span><span class=\"out-tag out-ok\">Se ne accorge</span>"));
   wrap.appendChild(box);

 function esitoFromBracket(br, rv){ 
 var rvStr = String(rv); 
 function inRange(rangeStr){ 
 var parts = rangeStr.split("-"); 
 for(var i=0;i<parts.length;i++){ 
 if(parts[i] === rvStr){ return true; } 
 } 
 return false; 
 } 
 if(inRange(br.z)){ return "0%"; } 
 if(inRange(br.tt)){ return "33%"; } 
 if(inRange(br.ss)){ return "66%"; } 
 return "100%"; 
 }

 function distillSpaceFrom(pg, eff, roll){
 if(eff === "skip" || eff === "0"){ return "standard"; }
 var isStudente = (pg.tipo === "studente");
 var haSapienza = haSapienzaPozionistica(pg);
 if(isStudente){
   if(eff === "33"){ return "1/2"; }
   if(eff === "66"){ if(roll === 1){ return "1/2"; } if(roll === 2){ return "1/3"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/2"; } if(roll === 3){ return "1/3"; } }
 } else if(haSapienza){
   if(eff === "33"){ return "1/4"; }
   if(eff === "100"){ return "1/5"; }
   if(eff === "66"){ if(roll === 1){ return "1/4"; } if(roll === 2){ return "1/5"; } }
 } else {
   if(eff === "33"){ return "1/3"; }
   if(eff === "66"){ if(roll === 1){ return "1/3"; } if(roll === 2){ return "1/4"; } }
   if(eff === "100"){ if(roll === 1 || roll === 2){ return "1/3"; } if(roll === 3){ return "1/4"; } }
 }
 return null;
 }

 function recomputeDistill(pg){ 
 var eff = pgDataGet(pg, "distill_eff", "skip"); 
 var out = document.getElementById("distill-out-" + pg.id); 
 if(!out){ return; } 
 out.innerHTML = "";
 pg.data["distill_space"] = "standard";

 if(eff === "skip"){ 
   out.appendChild(el("p", "small-note", "Nessuna Distillazione: la dose mantiene lo spazio standard."));
   updateFaticaBox(pg, "distill");
   return; 
 } 
 if(eff === "0"){ 
   out.appendChild(el("p", "small-note", "Distillazione fallita. La dose mantiene per ora lo spazio standard; puoi ritentare secondo regolamento."));
   updateFaticaBox(pg, "distill");
   return; 
 } 

 var haSapienza = haSapienzaPozionistica(pg);
 var isStudente = (pg.tipo === "studente"); 
 var faces = 0; 
 var esitoDesc = ""; 

 if(isStudente){ 
   if(eff === "100"){ faces = 3; esitoDesc = "1-2: dose = 1/2 spazio, 3: dose = 1/3 spazio"; } 
   if(eff === "66"){ faces = 2; esitoDesc = "1: dose = 1/2 spazio, 2: dose = 1/3 spazio"; } 
   if(eff === "33"){ pg.data["distill_space"] = "1/2"; out.appendChild(el("p", null, "Con Efficacia 33% la dose occupa direttamente <b>1/2 spazio</b>.")); updateFaticaBox(pg, "distill"); return; } 
 } else if(haSapienza){ 
   if(eff === "100"){ pg.data["distill_space"] = "1/5"; out.appendChild(el("p", null, "Con Efficacia 100% la dose occupa direttamente <b>1/5 spazio</b>.")); updateFaticaBox(pg, "distill"); return; } 
   if(eff === "66"){ faces = 2; esitoDesc = "1: dose = 1/4 spazio, 2: dose = 1/5 spazio"; } 
   if(eff === "33"){ pg.data["distill_space"] = "1/4"; out.appendChild(el("p", null, "Con Efficacia 33% la dose occupa direttamente <b>1/4 spazio</b>.")); updateFaticaBox(pg, "distill"); return; } 
 } else { 
   if(eff === "100"){ faces = 3; esitoDesc = "1-2: dose = 1/3 spazio, 3: dose = 1/4 spazio"; } 
   if(eff === "66"){ faces = 2; esitoDesc = "1: dose = 1/3 spazio, 2: dose = 1/4 spazio"; } 
   if(eff === "33"){ pg.data["distill_space"] = "1/3"; out.appendChild(el("p", null, "Con Efficacia 33% la dose occupa direttamente <b>1/3 spazio</b>.")); updateFaticaBox(pg, "distill"); return; } 
 } 

 if(faces > 0){ 
   var box = el("div", "result-line"); 
   var codeId = "distill-code-" + pg.id; 
   var codeDiv = el("div", "dice-code"); codeDiv.id = codeId; 
   codeDiv.textContent = "[dice=1d" + faces + "]Distillazione - " + pg.nome + " (" + esitoDesc + ")[/dice]"; 
   box.appendChild(codeDiv); 
   var copyBtn = el("button", "copy-btn", "Copia"); copyBtn.id = "distill-copy-" + pg.id; 
   box.appendChild(copyBtn); out.appendChild(box); 
   setTimeout(function(){ attachCopy("distill-copy-" + pg.id, codeId); }, 0); 
   out.appendChild(el("p", "small-note", esitoDesc));

   var resultLine = el("div", "result-line");
   resultLine.appendChild(el("span", null, "Risultato ottenuto:"));
   var rollInp = el("input"); rollInp.type = "number"; rollInp.min = "1"; rollInp.max = "" + faces; rollInp.placeholder = "1-" + faces;
   rollInp.value = pgDataGet(pg, "distill_roll", "");
   resultLine.appendChild(rollInp);
   var spaceTag = el("span", "out-tag out-neutral", "in attesa"); resultLine.appendChild(spaceTag); out.appendChild(resultLine);

   function aggiornaSpazio(){
     pg.data["distill_roll"] = rollInp.value;
     if(rollInp.value === ""){ pg.data["distill_space"] = null; spaceTag.textContent = "in attesa"; spaceTag.className = "out-tag out-neutral"; return; }
     var rv = num(rollInp.value, 0);
     var spazio = distillSpaceFrom(pg, eff, rv);
     if(spazio === null){ pg.data["distill_space"] = null; spaceTag.textContent = "fuori range"; spaceTag.className = "out-tag out-fail"; }
     else { pg.data["distill_space"] = spazio; spaceTag.textContent = spazio + " spazio"; spaceTag.className = "out-tag out-ok"; }
   }
   rollInp.addEventListener("input", aggiornaSpazio);
   aggiornaSpazio();
 } 
 
 updateFaticaBox(pg, "distill");
 }
